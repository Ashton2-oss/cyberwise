<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
svg{display:block;max-width:32px;max-height:32px;flex-shrink:0}
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface-2:#FAFAFE;
  --border:rgba(20,20,43,.08);--border-strong:rgba(20,20,43,.14);
  --ink:#1A1A2E;--ink-2:#4B4B6B;--ink-3:#8B8BA7;--ink-4:#B8B8CE;
  --lime:#C7F548;--lime-hover:#B8E63A;--lime-glow:rgba(199,245,72,.4);
  --lavender:#A78BFA;--lavender-2:#8B5CF6;--lavender-soft:rgba(167,139,250,.12);
  --sky:#60A5FA;--sky-soft:rgba(96,165,250,.12);
  --mint:#10B981;--mint-2:#34D399;--mint-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;--amber-2:#FBBF24;--amber-soft:rgba(245,158,11,.12);
  --rose:#EF4444;--rose-2:#F87171;--rose-soft:rgba(239,68,68,.12);
  --c-accent:#8B5CF6;--grid-color:rgba(20,20,43,.03);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0F141B;
  --surface:#171D29;
  --surface-2:#1F2735;
  --ink:#F3EBDD;
  --ink-2:#C6B9A7;
  --ink-3:#8A7F6D;
  --ink-4:#5D534C;
  --border:rgba(243,235,221,.08);
  --border-strong:rgba(243,235,221,.12);
  --lime:#C6D97A;
  --lime-hover:#D2E28D;
  --lime-glow:rgba(198,217,122,.12);
  --lavender:#A6B5D8;
  --lavender-2:#93A6D6;
  --lavender-soft:rgba(166,181,216,.12);
  --sky:#8BC7D8;
  --sky-soft:rgba(139,199,216,.12);
  --mint:#87C6A3;
  --mint-2:#A5D6B4;
  --mint-soft:rgba(135,198,163,.12);
  --amber:#D4A060;
  --amber-2:#E0AF6D;
  --amber-soft:rgba(212,160,96,.12);
  --rose:#D58989;
  --rose-2:#E0A0A0;
  --rose-soft:rgba(213,137,137,.12);
  --c-accent:#D4A060;
  --grid-color:rgba(243,235,221,.025);
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100%;transition:background .4s var(--ease),color .4s var(--ease);
}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-scene::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(16,185,129,.16), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.13), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.1), transparent 60%),
    var(--bg);
}
[data-theme="dark"] .bg-scene::before{
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(16,185,129,.1), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.08), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.06), transparent 60%),
    var(--bg);
}
.grid-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-color) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
  -webkit-mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
}
.cursor-dot,.cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:10000;
  will-change:transform;
  transition:opacity .3s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
}
.cursor-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c-accent);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 8px rgba(139,92,246,.5);
}
.cursor-ring{
  width:26px;height:26px;border-radius:50%;
  border:1.25px solid var(--c-accent);opacity:.5;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 0 10px rgba(139,92,246,.25);
}
[data-theme="dark"] .cursor-dot{
  box-shadow:0 0 6px var(--c-accent),0 0 12px rgba(167,139,250,.4);
  mix-blend-mode:screen;
}
[data-theme="dark"] .cursor-ring{
  box-shadow:0 0 12px rgba(167,139,250,.3);mix-blend-mode:screen;
}
.cursor-ring.is-hover{opacity:.9;border-color:var(--lavender-2)}
.cursor-ring.is-cta{opacity:1;border-color:var(--lavender-2)}
@media (max-width:1024px){.cursor-dot,.cursor-ring{display:none!important}}
@media (hover:none){.cursor-dot,.cursor-ring{display:none!important}}

/* ───── TOPBAR ───── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Inter',sans-serif;color:var(--ink-3);
  transition:background .3s,backdrop-filter .3s,border-color .3s;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom-color:var(--border);
}
.topbar .brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);
  font-size:1rem;font-weight:700;letter-spacing:-.025em;text-decoration:none;
}
.brand-mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--lavender-2),var(--sky));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(139,92,246,.35);
}
.brand-mark svg{width:17px;height:17px;color:#fff}
.topbar .nav{display:flex;align-items:center;gap:4px}
.topbar .nav a{
  color:var(--ink-2);text-decoration:none;
  font-size:.86rem;font-weight:500;
  padding:8px 14px;border-radius:100px;
  transition:all .2s var(--ease);
}
.topbar .nav a:hover{color:var(--ink);background:rgba(139,92,246,.06)}
.topbar .nav a.active{color:var(--ink);background:var(--lavender-soft)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-2);
  transition:all .25s var(--ease);position:relative;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-strong);transform:translateY(-1px)}
.theme-toggle svg{width:16px;height:16px;position:absolute;transition:all .35s var(--ease)}
.theme-toggle .ti-sun{opacity:0;transform:rotate(-90deg) scale(.6)}
.theme-toggle .ti-moon{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-moon{opacity:0;transform:rotate(90deg) scale(.6)}
@media(max-width:1024px){.topbar{padding:14px 20px}.topbar .nav a{padding:6px 9px;font-size:.78rem}}
@media(max-width:820px){
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:10px 14px}
  .topbar .brand{grid-column:1;grid-row:1}
  .topbar .nav{grid-column:1 / -1;grid-row:2;display:none;gap:2px;min-width:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:0 0 auto;white-space:nowrap;padding:6px 9px;font-size:.76rem}
  .topbar .actions{grid-column:2;grid-row:1}
}

/* ───── PAGE ───── */
.page{
  position:relative;z-index:10;
  max-width:680px;margin:0 auto;
  padding:120px 24px 80px;min-height:100vh;
  animation:pageIn .5s var(--ease);
}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:100px 18px 60px}}

/* ───── HERO ───── */
.hero{
  padding-bottom:32px;
  border-bottom:1px solid var(--border);
  margin-bottom:32px;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--mint);
  background:var(--mint-soft);
  padding:7px 14px;border-radius:100px;
  margin-bottom:22px;
}
.hero-eyebrow .dot{
  width:6px;height:6px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
}
.hero-title{
  font-size:clamp(1.9rem,4.4vw,2.6rem);
  font-weight:900;letter-spacing:-.038em;
  line-height:1.08;color:var(--ink);
  margin-bottom:16px;
}
.hero-title em{
  font-style:normal;
  background:linear-gradient(120deg,#34D399 0%,#60A5FA 50%,#A78BFA 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-lede{
  font-size:1.02rem;line-height:1.7;
  color:var(--ink-2);max-width:540px;
  margin-bottom:20px;
}
.hero-lede strong{color:var(--ink);font-weight:600}
.hero-progress{
  display:flex;gap:8px;flex-wrap:wrap;
  padding-top:20px;
  border-top:1px solid var(--border);
}
.hero-progress[hidden]{display:none}
.progress-chip{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 15px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;font-weight:600;color:var(--ink-2);
  letter-spacing:-.005em;text-decoration:none;
  transition:all .22s var(--ease);
}
a.progress-chip:hover{
  border-color:var(--border-strong);
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(20,20,43,.06);
}
.progress-chip svg{width:13px;height:13px;color:var(--ink-3)}
.progress-chip strong{color:var(--ink);font-weight:700}
.progress-chip[data-tone="daily"]{border-color:rgba(245,158,11,.28);background:var(--amber-soft)}
.progress-chip[data-tone="daily"] svg{color:var(--amber)}
.progress-chip[data-tone="guide"]{border-color:rgba(139,92,246,.28);background:var(--lavender-soft)}
.progress-chip[data-tone="guide"] svg{color:var(--lavender-2)}
.progress-chip[data-tone="spot"]{border-color:rgba(16,185,129,.28);background:var(--mint-soft)}
.progress-chip[data-tone="spot"] svg{color:var(--mint)}
.progress-chip[data-tone="score"]{border-color:rgba(96,165,250,.28);background:var(--sky-soft)}
.progress-chip[data-tone="score"] svg{color:var(--sky)}
.progress-chip[data-tone="recover"]{border-color:rgba(239,68,68,.24);background:var(--rose-soft)}
.progress-chip[data-tone="recover"] svg{color:var(--rose)}

/* ───── DIFFICULTY TILES ───── */
.difficulty-bar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:24px;
}
.diff-tile{
  padding:11px 13px;
  border-radius:11px;
  background:var(--surface-2);
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.diff-tile-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;margin-bottom:6px;
}
.diff-tile-name{
  font-family:'JetBrains Mono',monospace;
  font-size:.58rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.diff-tile-count{
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;font-weight:700;color:var(--ink-3);
}
.diff-tile-bar{
  height:3px;border-radius:100px;
  background:color-mix(in srgb,var(--ink-3) 18%,transparent);
  overflow:hidden;
}
.diff-tile-fill{
  height:100%;border-radius:100px;transition:width .7s var(--ease);
}
.diff-tile[data-level="easy"] .diff-tile-fill{background:var(--mint)}
.diff-tile[data-level="medium"] .diff-tile-fill{background:var(--amber)}
.diff-tile[data-level="hard"] .diff-tile-fill{background:var(--rose)}
.diff-tile.locked{opacity:.5}
.diff-tile.locked::before{
  content:'🔒';position:absolute;
  top:8px;right:8px;font-size:.7rem;opacity:.7;
}

/* ───── MESSAGE ───── */
.msg-wrap{margin-top:24px;animation:msgIn .5s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-meta{

}
.msg-cat-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg-cat{

  font-size:.62rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:6px 12px;border-radius:100px;
}
.msg-cat[data-cat="reward"]{color:var(--mint);background:var(--mint-soft)}
.msg-cat[data-cat="fear"]{color:var(--rose);background:var(--rose-soft)}
.msg-cat[data-cat="authority"]{color:var(--amber);background:var(--amber-soft)}
.msg-cat[data-cat="trust"]{color:var(--sky);background:var(--sky-soft)}

.diff-badge{

}
.diff-badge[data-level="easy"]{color:var(--mint);background:var(--mint-soft);border:1px solid rgba(16,185,129,.3)}
.diff-badge[data-level="medium"]{color:var(--amber);background:var(--amber-soft);border:1px solid rgba(245,158,11,.3)}
.diff-badge[data-level="hard"]{color:var(--rose);background:var(--rose-soft);border:1px solid rgba(239,68,68,.3)}
.diff-badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.msg-num{
  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;font-weight:600;color:var(--ink-3);letter-spacing:.05em;
}
.phone{
  width:100%;border-radius:22px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:0 20px 50px rgba(20,20,43,.08),inset 0 1px 0 rgba(255,255,255,.9);
  padding:22px 24px 20px;text-align:left;position:relative;overflow:hidden;
}
[data-theme="dark"] .phone{
  box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
.phone-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.phone-app{display:flex;align-items:center;gap:10px}
.phone-app-icon{
  width:32px;height:32px;border-radius:9px;overflow:hidden;flex-shrink:0;
  display:block;
  box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.06);
}
.phone-app-icon svg{width:100%;height:100%;display:block}
.phone-app-name{font-size:.88rem;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.phone-time{
  font-size:.72rem;font-weight:500;color:var(--ink-3);
  font-family:'JetBrains Mono',monospace;
}
.phone-sender{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.phone-sender-name{font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.phone-sender-tag{
  font-size:.62rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 9px;border-radius:100px;
  color:var(--amber);background:var(--amber-soft);
}
.phone-msg{
  font-size:1rem;line-height:1.65;color:var(--ink-2);
  letter-spacing:-.003em;margin-bottom:8px;
}
.phone-msg strong{color:var(--ink);font-weight:600}
.phone-msg em{
  font-style:normal;color:var(--lavender-2);
  font-weight:600;word-break:break-all;
}
.phone-foot{
  display:flex;align-items:center;gap:9px;
  padding-top:14px;margin-top:8px;
  border-top:1px solid var(--border);
  font-size:.74rem;color:var(--ink-3);
  font-family:'JetBrains Mono',monospace;
}
.phone-foot-dot{
  width:6px;height:6px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 0 3px var(--amber-soft);flex-shrink:0;
  animation:livePulse 2.4s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 0 3px var(--amber-soft)}
  50%{box-shadow:0 0 0 5px rgba(245,158,11,.15)}
}

/* ───── CHOICES ───── */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.choice{
  position:relative;text-align:left;
  padding:16px 20px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;color:var(--ink);
  font-family:inherit;font-size:.94rem;font-weight:500;
  line-height:1.45;cursor:pointer;
  transition:all .25s var(--ease);
  display:flex;align-items:center;gap:14px;width:100%;
}
.choice::before{
  content:attr(data-key);
  flex-shrink:0;width:24px;height:24px;border-radius:7px;
  background:color-mix(in srgb,var(--ink-3) 12%,transparent);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:700;color:var(--ink-3);
  transition:all .25s var(--ease);
}
.choice:hover{
  border-color:var(--border-strong);
  background:var(--surface-2);
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(20,20,43,.06);
}
.choice:hover::before{
  background:linear-gradient(135deg,var(--lavender-2),var(--sky));
  color:#fff;
}

/* ───── REVEAL ───── */
.reveal{animation:revealIn .5s var(--ease)}
@keyframes revealIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.reveal-verdict-row{
  display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:18px;
}
.reveal-verdict{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:8px 14px;border-radius:100px;
}
.reveal-verdict.safe{color:var(--mint);background:var(--mint-soft)}
.reveal-verdict.unsafe{color:var(--rose);background:var(--rose-soft)}
.reveal-verdict .rd{width:8px;height:8px;border-radius:50%;background:currentColor}
.points-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:700;letter-spacing:.08em;
  padding:8px 14px;border-radius:100px;
  background:var(--lavender-soft);color:var(--lavender-2);
  border:1px solid rgba(139,92,246,.25);
}
.points-badge.zero{
  background:color-mix(in srgb,var(--ink-3) 8%,transparent);
  color:var(--ink-3);border-color:var(--border);
}
.reveal-title{
  font-size:1.4rem;font-weight:800;letter-spacing:-.025em;
  line-height:1.2;color:var(--ink);margin-bottom:14px;
}
.reveal-body{
  font-size:.98rem;line-height:1.7;color:var(--ink-2);margin-bottom:28px;
}
.reveal-body strong{color:var(--ink);font-weight:600}
.block{
  margin-bottom:20px;padding:22px 24px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
}
.block-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.block-icon{
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.block-icon svg{width:16px;height:16px}
.block-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);
}
.block.signals .block-icon{background:var(--amber-soft);color:var(--amber)}
.signal-list{display:flex;flex-direction:column;gap:14px}
.signal{display:flex;align-items:flex-start;gap:12px}
.signal-num{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;font-weight:700;color:var(--amber);
  flex-shrink:0;width:20px;margin-top:2px;
}
.signal-text{flex:1;min-width:0}
.signal-name{
  font-size:.92rem;font-weight:700;color:var(--ink);
  margin-bottom:4px;letter-spacing:-.005em;
}
.signal-detail{font-size:.88rem;line-height:1.6;color:var(--ink-2)}
.block.stakes .block-icon{background:var(--rose-soft);color:var(--rose)}
.block.stakes p{font-size:.94rem;line-height:1.7;color:var(--ink-2)}
.block.stakes strong{color:var(--ink);font-weight:600}
.block.verify .block-icon{background:var(--mint-soft);color:var(--mint)}
.block.verify p{font-size:.94rem;line-height:1.7;color:var(--ink-2)}
.block.verify strong{color:var(--ink);font-weight:600}
.block.lever-block .block-icon{background:var(--lavender-soft);color:var(--lavender-2)}
.lever-name{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:6px 12px;border-radius:100px;
  background:var(--lavender-soft);color:var(--lavender-2);
  margin-bottom:12px;
}
.lever-name .ld{width:6px;height:6px;border-radius:50%;background:currentColor}
.lever-explain{font-size:.92rem;line-height:1.7;color:var(--ink-2)}

/* ───── CROSS-LINK ───── */
.crosslink{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-radius:14px;
  background:var(--surface);
  border:1px solid var(--border);
  text-decoration:none;color:inherit;
  transition:all .25s var(--ease);
  margin-bottom:20px;
}
.crosslink:hover{
  border-color:var(--lavender-2);
  transform:translateX(2px);
  box-shadow:0 8px 22px rgba(139,92,246,.1);
}
.crosslink-icon{
  width:38px;height:38px;border-radius:11px;
  background:var(--lavender-soft);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.crosslink-icon svg{width:18px;height:18px}
.crosslink-text{flex:1;min-width:0}
.crosslink-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
  margin-bottom:3px;
}
.crosslink-title{
  font-size:.92rem;font-weight:700;
  letter-spacing:-.01em;color:var(--ink);
  line-height:1.3;
}
.crosslink-arrow{
  color:var(--ink-4);flex-shrink:0;
  transition:all .25s var(--ease);
}
.crosslink-arrow svg{width:15px;height:15px}
.crosslink:hover .crosslink-arrow{
  color:var(--lavender-2);
  transform:translateX(3px);
}

/* ───── ACTIONS ───── */
.reveal-actions{
  display:flex;gap:12px;flex-wrap:wrap;
  margin-top:28px;padding-top:26px;
  border-top:1px solid var(--border);
}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:14px 24px;border-radius:100px;
  font-family:inherit;font-size:.94rem;font-weight:600;
  border:none;cursor:pointer;text-decoration:none;
  transition:all .25s var(--ease);justify-content:center;
}
.btn svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.btn-primary{
  background:var(--lime);color:var(--ink);
  box-shadow:0 6px 20px var(--lime-glow);font-weight:700;
  flex:1;min-width:200px;
}
.btn-primary:hover{
  background:var(--lime-hover);transform:translateY(-2px);
  box-shadow:0 12px 30px var(--lime-glow);
}
.btn-primary:hover svg{transform:translateX(4px)}
[data-theme="dark"] .btn-primary{
  background:#87965F;color:#121217;
  box-shadow:0 4px 12px rgba(135,150,95,.16);
}
[data-theme="dark"] .btn-primary:hover{
  background:#96A66B;
  box-shadow:0 8px 18px rgba(135,150,95,.2);
}
.btn-secondary{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--border);
}
.btn-secondary:hover{border-color:var(--border-strong);transform:translateY(-2px)}

/* ───── COMEBACK ───── */
.comeback{
  text-align:center;padding:32px 28px;border-radius:20px;
  background:linear-gradient(135deg,rgba(199,245,72,.08),rgba(52,211,153,.06));
  border:1px solid rgba(199,245,72,.3);margin-top:24px;
  animation:revealIn .5s var(--ease);
}
.comeback-icon{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,var(--lime),#34D399);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  box-shadow:0 8px 24px var(--lime-glow);
}
.comeback-icon svg{width:26px;height:26px;color:var(--ink)}
.comeback-title{
  font-size:1.25rem;font-weight:800;
  letter-spacing:-.025em;color:var(--ink);
  margin-bottom:10px;line-height:1.25;
}
.comeback-sub{
  font-size:.94rem;color:var(--ink-2);
  line-height:1.65;max-width:400px;margin:0 auto 22px;
}
.comeback-sub strong{color:var(--ink);font-weight:600}
.comeback-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ───── COMPLETE ───── */
.complete{text-align:center;padding:20px 0;animation:revealIn .6s var(--ease)}
.complete-icon{
  width:80px;height:80px;margin:0 auto 24px;border-radius:50%;
  background:linear-gradient(135deg,var(--mint-soft),var(--lavender-soft));
  border:1px solid rgba(16,185,129,.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(16,185,129,.2);
}
.complete-icon svg{width:36px;height:36px;color:var(--mint)}
.complete-title{
  font-size:1.6rem;font-weight:800;letter-spacing:-.03em;
  margin-bottom:14px;color:var(--ink);
}
.complete-sub{
  font-size:1rem;color:var(--ink-2);line-height:1.7;
  max-width:440px;margin:0 auto 32px;
}
.complete-sub strong{color:var(--ink);font-weight:600}
.complete-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  max-width:440px;margin:0 auto 32px;
}
.stat{
  padding:18px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;text-align:center;
}
.stat-v{
  font-size:1.5rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--lavender-2),var(--mint));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.1;margin-bottom:6px;
}
.stat-l{
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);
}

/* ───── FOOTER ───── */
.footer{
  margin-top:56px;padding-top:28px;
  border-top:1px solid var(--border);
  text-align:center;font-size:.82rem;
  color:var(--ink-3);line-height:1.7;
}
.footer-links{
  display:flex;justify-content:center;gap:18px;
  flex-wrap:wrap;margin-bottom:14px;
}
.footer a{color:var(--ink-3);text-decoration:none;transition:color .2s var(--ease)}
.footer a:hover{color:var(--ink)}
.footer-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;letter-spacing:.02em;color:var(--ink-4);
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>

        {name:'Your curiosity is the exploit',detail:'Every part of the message — the label, the location, the timing before exam season — is engineered for curiosity.'}
      ],
      choices:[{label:'Plug it in — maybe the results are out early.',safe:false},{label:'Hand it to lab staff. Do not plug it in.',safe:true}],
      safeResult:{title:'You handed it in.',body:'That was the right move. A USB drive found in a public place is one of the oldest attack vectors still working today. The curiosity is natural — that\'s why it works.'},
      unsafeResult:{title:'The drive executed something.',body:'Some drives launch malware the moment they\'re inserted. Others contain a fake PDF that asks you to "enable macros." Either way, the results aren\'t there — but the attacker is now on the machine.'},
      stakes:'Whatever computer you plug it into — and every account logged into on that computer.',
      verify:'Hand it to lab staff. If it belongs to someone, they can collect it from lost property.',
      lever:'reward',
      leverExplain:'The label promises something you want — early results, salary info, confidential documents. Curiosity opens the door. The drive does the rest.'
    },
    { id:'lab-qr-code', difficulty:'easy', category:'reward', catLabel:'Physical scam', guideSection:'3', channel:'QR code', sender:'Posted on a lab notice board', senderLabel:'Printed notice', time:'—',
      message:'FREE AIRTIME — scan to claim a R100 data bundle. Offer valid for UJ students only. Limited to first 100 scans.',
      signals:[
        {name:'QR codes hide their destination',detail:'Unlike a URL you can read, a QR code is opaque. You cannot see where it goes until after you\'ve scanned.'},
        {name:'Off-campus distribution',detail:'A printed notice on a lab board bypasses every email filter and every spam warning. It relies on physical trust.'},
        {name:'"UJ students only"',detail:'Naming your institution makes it feel targeted and official. It also makes it feel like something you\'re supposed to do.'},
        {name:'First 100 scans',detail:'Scarcity forces a decision before thought. Real promotions don\'t depend on you racing.'}
      ],
      choices:[{label:'Scan — free data is free data.',safe:false},{label:'Search for the offer and check with the university.',safe:true}],
      safeResult:{title:'You checked.',body:'UJ\'s IT department has never posted a QR code for free data. The offer was invented. Whatever the QR code opened was designed to look like a university page and ask you to sign in.'},
      unsafeResult:{title:'The QR opened a login page.',body:'It looked like a UJ page. It asked for your student number and password. You entered them. QR codes can point anywhere — you have no way of knowing the destination before you scan.'},
      stakes:'Your UJ credentials, captured on a page that looked official and never existed.',
      verify:'Search for the promotion by name. If it\'s real, it exists on an official page. If the only place it lives is the QR code, it isn\'t real.',
      lever:'reward',
      leverExplain:'A free offer plus a scarcity cue ("first 100 scans") turns curiosity into action. The physical poster format bypasses the digital scepticism you\'d apply to an email.'
    },

    { id:'microsoft-verify', difficulty:'easy', category:'fear', catLabel:'Fake security alert', guideSection:'3', channel:'Email', sender:'noreply@microsoft-account-verify.com', senderLabel:'Microsoft', time:'11:14',

        {name:'Domain not microsoft.com',detail:'microsoft-account-verify.com is not microsoft.com. Microsoft runs security notices from their own domain, never a lookalike.'},
        {name:'Foreign location trigger',detail:'A specific distant city makes the threat feel real and specific. Attackers choose exotic locations because they work.'},
        {name:'Urgency built in',detail:'"Secure your account immediately" is designed to skip the ten seconds it would take to check the sender.'},
        {name:'Plausible scenario',detail:'Unusual sign-in alerts are real — Microsoft does send them. That\'s exactly why the fake one works.'}

    { id:'standard-bank-blocked', difficulty:'easy', category:'fear', catLabel:'Account locked', guideSection:'3', channel:'SMS', sender:'+27 84 662 1177', senderLabel:'Unknown number', time:'07:02',

        {name:'Urgency without context',detail:'No mention of why, no reference number, no way to check in the app. Real banks always give you context first.'},

      verify:'If you want to be certain, cover your webcam and check your accounts. But the email itself is mass-produced spam.',

    { id:'capitec-careers', difficulty:'medium', category:'authority', catLabel:'Authority', guideSection:'4', channel:'Email', sender:'hr@capitec-careers.co.za', senderLabel:'Careers Team', time:'09:47',

  // ═══════════════ CONFIG ═══════════════
  const POINTS      = { easy:10, medium:20, hard:30 };

  function ic(name, w){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  const APP_ICONS = {
    'SMS':{id:'app-messages',name:'Messages'},'Messages':{id:'app-messages',name:'Messages'},
    'Email':{id:'app-mail',name:'Mail'},'Mail':{id:'app-mail',name:'Mail'},

    'Instagram':{id:'app-instagram',name:'Instagram'},'Instagram DM':{id:'app-instagram',name:'Instagram'},

    'Gaming platform':{id:'app-game',name:'Gaming'},'Bank':{id:'app-bank',name:'Banking'}
  };

  function appIconHTML(channel){
    const meta = APP_ICONS[channel] || APP_ICONS.SMS;
    return '<svg viewBox="0 0 40 40" aria-hidden="true"><use href="#' + meta.id + '"/></svg>';
  }

  function appName(channel){
    const meta = APP_ICONS[channel] || APP_ICONS.SMS;
    return meta.name;
  }

  // ═══════════════ HELPERS ═══════════════
  const pad = n => String(n).padStart(2, '0');

  function todayStr(d){
    const x = d ? new Date(d) : new Date();
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }
  function yesterdayStr(){
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return todayStr(d);
  }

  // ═══════════════ STATE ═══════════════
  let state = loadState();

  function loadState(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { raw = null; }
    const s = Object.assign({
      score:0, correct:0, wrong:0, streak:0, bestStreak:0,
      dayStreak:0, day:null, todayIds:[], answered:{},
      current:null, phase:'question', lastPick:null, bonus:false
    }, raw && typeof raw === 'object' ? raw : {});
    if (!s.answered || typeof s.answered !== 'object') s.answered = {};
    if (!Array.isArray(s.todayIds)) s.todayIds = [];
    if (typeof s.bonus !== 'boolean') s.bonus = false;
    if (s.phase !== 'reveal') s.phase = 'question';
    if (s.day && s.day !== todayStr() && s.day !== yesterdayStr()) s.dayStreak = 0;
    return s;
  }

  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function doneCount(){ return SCENARIOS.filter(s => state.answered[s.id]).length; }
  function allDone(){ return SCENARIOS.every(s => state.answered[s.id]); }
  function todaysCount(){ return state.day === todayStr() ? state.todayIds.length : 0; }

  function unlockedTiers(){
    const done = doneCount();
    const t = ['easy'];
    if (done >= UNLOCK.medium) t.push('medium');
    if (done >= UNLOCK.hard)   t.push('hard');
    return t;
  }

  function pickNext(){
    const tiers = unlockedTiers();
    for (let i = 0; i < SCENARIOS.length; i++){
      const sc = SCENARIOS[i];
      if (state.answered[sc.id]) continue;
      if (tiers.indexOf(sc.difficulty) === -1) continue;
      return sc;
    }
    return null;
  }

  function currentScenario(){
    if (state.current){
      const sc = SCENARIOS.find(s => s.id === state.current);
      if (sc){
        if (state.phase === 'reveal') return sc;
        if (!state.answered[sc.id]) return sc;
      }
    }
    const next = pickNext();
    if (next){
      state.current  = next.id;
      state.phase    = 'question';
      state.lastPick = null;
      save();
    }
    return next;
  }

  function touchDay(){
    const t = todayStr();
    if (state.day === t) return;
    state.dayStreak = (state.day === yesterdayStr()) ? (state.dayStreak || 0) + 1 : 1;
    state.day       = t;
    state.todayIds  = [];
    state.bonus     = false;
  }

  // ═══════════════ STATE READERS FOR HERO ═══════════════
  function readDaily(){
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem('cyberwise.daily.v1') || '{}') || {}; } catch (e) {}
    const history = raw.history && typeof raw.history === 'object' ? raw.history : {};
    const playedCount = Object.keys(history).length;
    const correctCount = Object.keys(history).filter(k => history[k] && history[k].correct).length;
    return {
      streak: typeof raw.streak === 'number' ? raw.streak : 0,
      playedCount: playedCount,
      correctCount: correctCount,
      hasProgress: playedCount > 0
    };
  }

  function readGuide(){
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem('cyberwise.guide.v1') || '{}') || {}; } catch (e) {}
    const read = raw.read && typeof raw.read === 'object' ? raw.read : {};
    const ids = Object.keys(read).filter(k => read[k]);
    return { readCount: ids.length, hasProgress: ids.length > 0 };
  }

  function readRecovery(){
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem('cyberwise.recovery.v1') || '{}') || {}; } catch (e) {}
    const done = raw.done && typeof raw.done === 'object' ? raw.done : {};
    const count = Object.keys(done).filter(k => done[k]).length;
    return { doneCount: count, hasProgress: !!raw.triage || count > 0 };
  }

  // ═══════════════ RENDER — HERO ═══════════════
  function heroHTML(){
    const done  = doneCount();
    const total = SCENARIOS.length;
    const left  = Math.max(0, DAILY_LIMIT - todaysCount());
    const daily = readDaily();
    const guide = readGuide();
    const rec   = readRecovery();

    // Lede adapts to progress
    let lede;
    if (done === 0){
      lede = 'Read each message the way you would on your phone — <strong>then decide</strong>. Five a day, real tactics, and a reveal that shows you exactly what to look for.';
    } else if (allDone()){
      lede = "You've seen every scenario. Come back to <strong>review the ones that caught you out</strong>, or help a friend spot their first one.";
    } else if (left === 0){
      lede = "That's your five for today. <strong>Come back tomorrow</strong> for more — harder tiers unlock as you go.";
    } else {
      lede = '<strong>' + left + ' scenario' + (left === 1 ? '' : 's') + ' left today.</strong> Every one is a real tactic used against South African students right now.';
    }

    // Progress chips
    const chips = [];

    if (daily.streak > 0){
      chips.push(
        '<a class="progress-chip" data-tone="daily" href="daily.html">' + ic('flame', 2.4) +
        '<span>Daily: <strong>' + daily.streak + '</strong>-day streak</span></a>'
      );
    }

    if (guide.hasProgress){
      chips.push(
        '<a class="progress-chip" data-tone="guide" href="guide.html">' + ic('book', 2.4) +
        '<span>Guide: <strong>' + guide.readCount + '</strong> of 13</span></a>'
      );
    }

    if (done > 0){
      chips.push(
        '<span class="progress-chip" data-tone="spot">' + ic('check', 2.4) +
        '<span><strong>' + done + '</strong> of ' + total + ' seen</span></span>'
      );
    }

    if (state.score > 0){
      chips.push(
        '<span class="progress-chip" data-tone="score">' + ic('star', 2.4) +
        '<span><strong>' + state.score + '</strong> pts</span></span>'
      );
    }

    if (rec.hasProgress){
      chips.push(
        '<a class="progress-chip" data-tone="recover" href="recovery.html">' + ic('shield', 2.4) +
        '<span>Recovery: <strong>' + rec.doneCount + '</strong> steps</span></a>'
      );
    }

    const progressHTML = chips.length
      ? '<div class="hero-progress">' + chips.join('') + '</div>'
      : '';

    return '' +
    '<section class="hero">' +
      '<div class="hero-eyebrow"><span class="dot"></span>Practise · 21 scenarios · 5 a day</div>' +
      '<h1 class="hero-title">Read it like it just <em>landed on your phone</em>.</h1>' +
      '<p class="hero-lede">' + lede + '</p>' +
      progressHTML +
    '</section>';
  }

  // ═══════════════ RENDER — DIFFICULTY TILES ═══════════════
  function difficultyHTML(){
    const tiers = unlockedTiers();
    return '' +
    '<div class="difficulty-bar">' +
      ['easy','medium','hard'].map(function(lvl){
        const inTier   = SCENARIOS.filter(s => s.difficulty === lvl);
        const doneTier = inTier.filter(s => state.answered[s.id]).length;
        const p = inTier.length ? Math.round(doneTier / inTier.length * 100) : 0;
        const locked = tiers.indexOf(lvl) === -1;
        return '' +
          '<div class="diff-tile' + (locked ? ' locked' : '') + '" data-level="' + lvl + '">' +
            '<div class="diff-tile-top">' +
              '<span class="diff-tile-name">' + lvl + '</span>' +
              '<span class="diff-tile-count">' + doneTier + '/' + inTier.length + '</span>' +
            '</div>' +
            '<div class="diff-tile-bar"><div class="diff-tile-fill" style="width:' + p + '%"></div></div>' +
          '</div>';
      }).join('') +
    '</div>';
  }

  // ═══════════════ RENDER — PHONE ═══════════════
  function phoneHTML(sc){
    const ch = CHANNELS[sc.channel] || CHANNELS['SMS'];
    return '' +
    '<div class="phone">' +
      '<div class="phone-head">' +
        '<div class="phone-app">' +
          '<div class="phone-app-icon">' + appIconHTML(sc.channel) + '</div>' +

        '</div>' +
        '<div class="phone-time">' + (sc.time || '') + '</div>' +
      '</div>' +
      '<div class="phone-sender">' +
        '<div class="phone-sender-name">' + sc.sender + '</div>' +
        (sc.senderLabel ? '<span class="phone-sender-tag">' + sc.senderLabel + '</span>' : '') +
      '</div>' +
      '<p class="phone-msg">' + sc.message + '</p>' +
      '<div class="phone-foot"><span class="phone-foot-dot"></span>' + (sc.foot || ch.foot) + '</div>' +
    '</div>';
  }

  function metaHTML(sc){
    const n = SCENARIOS.indexOf(sc) + 1;
    return '' +
    '<div class="msg-meta">' +
      '<div class="msg-cat-row">' +
        '<span class="msg-cat" data-cat="' + sc.category + '"><span class="dot"></span>' + sc.catLabel + '</span>' +
        '<span class="diff-badge" data-level="' + sc.difficulty + '"><span class="dot"></span>' + sc.difficulty + '</span>' +
      '</div>' +
      '<span class="msg-num">SCENARIO ' + pad(n) + ' / ' + SCENARIOS.length + '</span>' +
    '</div>';
  }

  // ═══════════════ RENDER — QUESTION ═══════════════
  function questionHTML(sc){
    const choices = sc.choices.map(function(c, i){
      return '<button type="button" class="choice" data-choice="' + i + '" data-key="' + (i + 1) + '">' + c.label + '</button>';
    }).join('');

    return '' +
    '<section class="msg-wrap">' +
      metaHTML(sc) +
      phoneHTML(sc) +
      '<div class="choices">' + choices + '</div>' +
    '</section>';
  }

  // ═══════════════ RENDER — REVEAL ═══════════════
  function revealHTML(sc){
    const rec     = state.answered[sc.id] || { correct:false };
    const correct = !!rec.correct;
    const res     = correct ? sc.safeResult : sc.unsafeResult;
    const pts     = correct ? POINTS[sc.difficulty] : 0;

    const signals = sc.signals.map(function(s, i){
      return '' +
      '<div class="signal">' +
        '<div class="signal-num">' + pad(i + 1) + '</div>' +
        '<div class="signal-text">' +
          '<div class="signal-name">' + s.name + '</div>' +
          '<div class="signal-detail">' + s.detail + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // Cross-link to the guide
    let crosslinkHTML = '';
    if (sc.guideSection){
      crosslinkHTML =
        '<a class="crosslink" href="guide.html#sec-' + sc.guideSection + '">' +
          '<div class="crosslink-icon">' + ic('book', 2.2) + '</div>' +
          '<div class="crosslink-text">' +
            '<div class="crosslink-label">Read more · Section ' + sc.guideSection + '</div>' +
            '<div class="crosslink-title">' + (GUIDE_TITLES[sc.guideSection] || '') + '</div>' +
          '</div>' +
          '<span class="crosslink-arrow">' + ic('arrow', 2.4) + '</span>' +
        '</a>';
    }

    return '' +
    '<section class="reveal">' +
      metaHTML(sc) +

      '<div class="reveal-verdict-row">' +
        '<span class="reveal-verdict ' + (correct ? 'safe' : 'unsafe') + '"><span class="rd"></span>' +
          (correct ? 'Correct call' : 'Phished') +
        '</span>' +
        '<span class="points-badge' + (pts ? '' : ' zero') + '">' + (pts ? '+' + pts + ' pts' : '0 pts') + '</span>' +
      '</div>' +

      '<h2 class="reveal-title">' + res.title + '</h2>' +
      '<p class="reveal-body">' + res.body + '</p>' +

      crosslinkHTML +

      '<div class="block signals">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('alert', 2) + '</div>' +
          '<div class="block-label">Signals in this message</div>' +
        '</div>' +
        '<div class="signal-list">' + signals + '</div>' +
      '</div>' +

      '<div class="block stakes">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('shieldAlert', 2) + '</div>' +
          '<div class="block-label">What was at stake</div>' +
        '</div>' +
        '<p>' + sc.stakes + '</p>' +
      '</div>' +

      '<div class="block verify">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('checkCircle', 2) + '</div>' +
          '<div class="block-label">How to verify</div>' +
        '</div>' +
        '<p>' + sc.verify + '</p>' +
      '</div>' +

      '<div class="block lever-block">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('target', 2) + '</div>' +
          '<div class="block-label">The lever used</div>' +
        '</div>' +
        '<span class="lever-name"><span class="ld"></span>' + (LEVERS[sc.lever] || sc.lever) + '</span>' +
        '<p class="lever-explain">' + sc.leverExplain + '</p>' +
      '</div>' +

      '<div class="reveal-actions">' +
        '<button type="button" class="btn btn-primary" data-action="next">Next scenario ' + ic('arrow', 2) + '</button>' +
        (correct ? '' : '<a class="btn btn-secondary" href="recovery.html">Recovery steps</a>') +
      '</div>' +
    '</section>';
  }

  // ═══════════════ RENDER — COMEBACK ═══════════════
  function comebackHTML(){
    const todaySc = state.todayIds
      .map(id => SCENARIOS.find(s => s.id === id))
      .filter(Boolean);
    const right = todaySc.filter(s => state.answered[s.id] && state.answered[s.id].correct).length;
    const total = todaySc.length;
    const days  = state.dayStreak || 1;
    const remaining = SCENARIOS.filter(s => !state.answered[s.id]).length;

    return '' +
    '<div class="comeback">' +
      '<div class="comeback-icon">' + ic('clock', 2) + '</div>' +
      '<h2 class="comeback-title">That\'s your five for today.</h2>' +
      '<p class="comeback-sub">You called <strong>' + right + ' of ' + total + '</strong> correctly. ' +
        'Your streak is now <strong>' + days + ' ' + (days === 1 ? 'day' : 'days') + '</strong>. ' +
        'Come back tomorrow for five new scenarios — Medium and Hard unlock as you go.</p>' +
      '<div class="comeback-actions">' +
        (remaining
          ? '<button type="button" class="btn btn-primary" data-action="keep-practising">Keep practising · bonus mode ' + ic('arrow', 2) + '</button>'
          : '<a class="btn btn-primary" href="daily.html">Try today\'s Daily Phish ' + ic('arrow', 2) + '</a>') +
        '<a class="btn btn-secondary" href="guide.html">Read the guide</a>' +
      '</div>' +
    '</div>';
  }

  // ═══════════════ RENDER — COMPLETE ═══════════════
  function completeHTML(){
    const total     = SCENARIOS.length;
    const attempted = state.correct + state.wrong;
    const acc       = attempted ? Math.round(state.correct / attempted * 100) : 0;

    return '' +
    '<div class="complete">' +
      '<div class="complete-icon">' + ic('check', 2) + '</div>' +
      '<h2 class="complete-title">You have seen every scenario.</h2>' +
      '<p class="complete-sub">You worked through all <strong>' + total + '</strong> messages — reward scams, fear tactics, ' +
        'authority impersonation, trust hijacks and urgency plays. That is the full set of levers attackers use.</p>' +
      '<div class="complete-stats">' +
        '<div class="stat"><div class="stat-v">' + acc + '%</div><div class="stat-l">Accuracy</div></div>' +
        '<div class="stat"><div class="stat-v">' + state.score + '</div><div class="stat-l">Points</div></div>' +
        '<div class="stat"><div class="stat-v">' + (state.bestStreak || 0) + '</div><div class="stat-l">Best streak</div></div>' +
      '</div>' +
      '<div class="comeback-actions">' +
        '<a class="btn btn-primary" href="data_breach.html">Visit the Breach Lab ' + ic('arrow', 2) + '</a>' +
        '<button type="button" class="btn btn-secondary" data-action="reset">Start over</button>' +
      '</div>' +
    '</div>';
  }

  // ═══════════════ FOOTER ═══════════════
  function footerHTML(){
    return '' +
    '<footer class="footer">' +
      '<div class="footer-links">' +
        '<a href="landing.html">Home</a>' +
        '<a href="guide.html">Guide</a>' +
        '<a href="daily.html">Daily</a>' +
        '<a href="data_breach.html">Breach Lab</a>' +
        '<a href="recovery.html">Recovery</a>' +
      '</div>' +
      '<div class="footer-meta">CyberWise · Spot the Phish · No accounts · No tracking</div>' +
    '</footer>';
  }

  // ═══════════════ MAIN RENDER ═══════════════
  function render(){
    const page = document.getElementById('page');
    let body;

    if (state.phase === 'reveal' && state.current){
      const sc = SCENARIOS.find(s => s.id === state.current);
      body = sc ? revealHTML(sc) : comebackHTML();
    } else if (allDone()){
      body = completeHTML();
    } else if (todaysCount() >= DAILY_LIMIT && !state.bonus){
      body = comebackHTML();
    } else {
      const sc = currentScenario();
      body = sc ? questionHTML(sc) : completeHTML();
    }

    page.innerHTML = heroHTML() + difficultyHTML() + body + footerHTML();
  }

  // ═══════════════ ACTIONS ═══════════════
  function answer(index){
    if (state.phase !== 'question') return;

    const sc = currentScenario();
    if (!sc) return;

    const choice = sc.choices[index];
    if (!choice) return;

    touchDay();

    const inBonus = state.bonus === true;
    const correct = !!choice.safe;
    const pts     = correct && !inBonus ? POINTS[sc.difficulty] : 0;

    state.answered[sc.id] = { correct: correct, pts: pts, at: Date.now(), bonus: inBonus };
    if (!inBonus && state.todayIds.indexOf(sc.id) === -1) state.todayIds.push(sc.id);

    if (!inBonus){
      state.score += pts;
      if (correct){
        state.correct++;
        state.streak++;
        if (state.streak > (state.bestStreak || 0)) state.bestStreak = state.streak;
      } else {
        state.wrong++;
        state.streak = 0;
      }
    }

    state.phase    = 'reveal';
    state.lastPick = index;
    save();
    render();

    const el = document.querySelector('.reveal');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function goNext(){
    state.phase    = 'question';
    state.current  = null;
    state.lastPick = null;
    save();
    render();

    const el = document.querySelector('.msg-wrap') || document.querySelector('.comeback') || document.querySelector('.complete');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    else window.scrollTo({ top:0, behavior:'smooth' });
  }

  function resetAll(){
    if (!window.confirm('Reset all progress? Your score, streak and answered scenarios will be cleared.')) return;
    state = {
      score:0, correct:0, wrong:0, streak:0, bestStreak:0,
      dayStreak:0, day:null, todayIds:[], answered:{},
      current:null, phase:'question', lastPick:null, bonus:false
    };
    save();
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  // ═══════════════ EVENTS ═══════════════
  document.addEventListener('click', function(e){
    const choice = e.target.closest('[data-choice]');
    if (choice){
      answer(parseInt(choice.getAttribute('data-choice'), 10));
      return;
    }
    const keepBtn = e.target.closest('[data-action="keep-practising"]');
    if (keepBtn){
      if (allDone()) return;
      state.bonus = true;
      state.phase = 'question';
      state.current = null;
      state.lastPick = null;
      save();
      render();
      const el = document.querySelector('.msg-wrap');
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    const nextBtn = e.target.closest('[data-action="next"]');
    if (nextBtn){ goNext(); return; }

    const resetBtn = e.target.closest('[data-action="reset"]');
    if (resetBtn){ resetAll(); return; }
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (state.phase === 'question'){
      if (e.key === '1' || e.key === '2'){
        e.preventDefault();
        answer(parseInt(e.key, 10) - 1);
      }
    } else if (state.phase === 'reveal'){
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        goNext();
      }
    }
  });

  // ═══════════════ THEME ═══════════════
  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle){
    themeToggle.addEventListener('click', function(){
      const cur  = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('cyberwise.theme', next); } catch (e) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', next === 'dark' ? '#0B0A17' : '#F5F4FB');
    });
  }

  // ═══════════════ TOPBAR SCROLL ═══════════════
  const topbar = document.getElementById('topbar');
  function onScroll(){
    if (!topbar) return;
    topbar.classList.toggle('scrolled', window.scrollY > 12);
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  // ═══════════════ CUSTOM CURSOR ═══════════════
  (function cursor(){
    const canRun = window.matchMedia('(hover: hover) and (pointer: fine)').matches && window.innerWidth > 1024;
    if (!canRun) return;
    const dot  = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    if (!dot || !ring) return;

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;
    let scale = 1, targetScale = 1;

    window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, { passive:true });

    document.addEventListener('mouseover', function(e){
      const t = e.target.closest('a, button, .choice, .crosslink');
      if (t){
        targetScale = 1.14;
        ring.classList.add('is-hover');
        if (t.classList.contains('btn-primary') || t.classList.contains('choice') || t.classList.contains('crosslink')) {
          ring.classList.add('is-cta');
        }
      }
    });

    document.addEventListener('mouseout', function(e){
      const t = e.target.closest('a, button, .choice, .crosslink');
      if (t){
        targetScale = 1;
        ring.classList.remove('is-hover', 'is-cta');
      }
    });

    (function tick(){
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      scale += (targetScale - scale) * 0.22;
      dot.style.transform  = 'translate3d(' + (mx - 3) + 'px,' + (my - 3) + 'px,0)';
      ring.style.transform = 'translate3d(' + (rx - 13) + 'px,' + (ry - 13) + 'px,0) scale(' + scale + ')';
      requestAnimationFrame(tick);
    })();
  })();

  // ═══════════════ BOOT ═══════════════
  render();
})();
</script>
<script src="register-sw.js"></script>
<script src="navigation.js"></script>
</body>
</html>
