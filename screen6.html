<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<script>
(function(){
  try {
    var t = localStorage.getItem('cyberwise.theme');
    if (!t) t = 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<title>CyberWise — Spot the Phish</title>
<meta name="description" content="31 phishing scenarios. Read each like it just landed on your phone, then decide."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#0F141B"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
svg{display:block;max-width:32px;max-height:32px;flex-shrink:0}
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface-2:#FAFAFE;
  --border:rgba(20,20,43,.08);--border-strong:rgba(20,20,43,.14);
  --ink:#1A1A2E;--ink-2:#4B4B6B;--ink-3:#8B8BA7;--ink-4:#B8B8CE;
  --lime:#C7F548;--lime-hover:#B8E63A;--lime-glow:rgba(199,245,72,.4);
  --lavender:#A78BFA;--lavender-2:#8B5CF6;--lavender-soft:rgba(167,139,250,.12);
  --sky:#60A5FA;--sky-soft:rgba(96,165,250,.12);
  --mint:#10B981;--mint-2:#34D399;--mint-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;--amber-2:#FBBF24;--amber-soft:rgba(245,158,11,.12);
  --rose:#EF4444;--rose-2:#F87171;--rose-soft:rgba(239,68,68,.12);
  --c-accent:#8B5CF6;--grid-color:rgba(20,20,43,.03);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0F141B;--surface:#171D29;--surface-2:#1F2735;
  --ink:#F3EBDD;--ink-2:#C6B9A7;--ink-3:#8A7F6D;--ink-4:#5D534C;
  --border:rgba(243,235,221,.08);--border-strong:rgba(243,235,221,.12);
  --lime:#C6D97A;--lime-hover:#D2E28D;--lime-glow:rgba(198,217,122,.12);
  --lavender:#A6B5D8;--lavender-2:#93A6D6;--lavender-soft:rgba(166,181,216,.12);
  --sky:#8BC7D8;--sky-soft:rgba(139,199,216,.12);
  --mint:#87C6A3;--mint-2:#A5D6B4;--mint-soft:rgba(135,198,163,.12);
  --amber:#D4A060;--amber-2:#E0AF6D;--amber-soft:rgba(212,160,96,.12);
  --rose:#D58989;--rose-2:#E0A0A0;--rose-soft:rgba(213,137,137,.12);
  --c-accent:#D4A060;--grid-color:rgba(243,235,221,.025);
}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100%;transition:background .4s var(--ease),color .4s var(--ease);}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-scene::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 900px 600px at 15% -10%, rgba(16,185,129,.16), transparent 60%),radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.13), transparent 65%),radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.1), transparent 60%),var(--bg);}
[data-theme="dark"] .bg-scene::before{background:radial-gradient(ellipse 900px 600px at 15% -10%, rgba(16,185,129,.1), transparent 60%),radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.08), transparent 65%),radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.06), transparent 60%),var(--bg);}
.grid-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);-webkit-mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);}
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:10000;will-change:transform;transition:opacity .3s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);}
.cursor-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 8px rgba(139,92,246,.5);}
.cursor-ring{width:26px;height:26px;border-radius:50%;border:1.25px solid var(--c-accent);opacity:.5;box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 0 10px rgba(139,92,246,.25);}
[data-theme="dark"] .cursor-dot{box-shadow:0 0 6px var(--c-accent),0 0 12px rgba(167,139,250,.4);mix-blend-mode:screen;}
[data-theme="dark"] .cursor-ring{box-shadow:0 0 12px rgba(167,139,250,.3);mix-blend-mode:screen;}
.cursor-ring.is-hover{opacity:.9;border-color:var(--lavender-2)}
.cursor-ring.is-cta{opacity:1;border-color:var(--lavender-2)}
@media (max-width:1024px){.cursor-dot,.cursor-ring{display:none!important}}
@media (hover:none){.cursor-dot,.cursor-ring{display:none!important}}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;font-family:'Inter',sans-serif;color:var(--ink-3);transition:background .3s,backdrop-filter .3s,border-color .3s;border-bottom:1px solid transparent;}
.topbar.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom-color:var(--border);}
.topbar .brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:1rem;font-weight:700;letter-spacing:-.025em;text-decoration:none;}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--lavender-2),var(--sky));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(139,92,246,.35);}
.brand-mark svg{width:17px;height:17px;color:#fff}
.topbar .nav{display:flex;align-items:center;gap:4px}
.topbar .nav a{color:var(--ink-2);text-decoration:none;font-size:.86rem;font-weight:500;padding:8px 14px;border-radius:100px;transition:all .2s var(--ease);}
.topbar .nav a:hover{color:var(--ink);background:rgba(139,92,246,.06)}
.topbar .nav a.active{color:var(--ink);background:var(--lavender-soft)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.theme-toggle{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);transition:all .25s var(--ease);position:relative;}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-strong);transform:translateY(-1px)}
.theme-toggle svg{width:16px;height:16px;position:absolute;transition:all .35s var(--ease)}
.theme-toggle .ti-sun{opacity:0;transform:rotate(-90deg) scale(.6)}
.theme-toggle .ti-moon{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-moon{opacity:0;transform:rotate(90deg) scale(.6)}
@media(max-width:1024px){.topbar{padding:14px 20px}.topbar .nav a{padding:6px 9px;font-size:.78rem}}
@media(max-width:820px){
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:10px 14px}
  .topbar .brand{grid-column:1;grid-row:1}
  .topbar .nav{grid-column:1 / -1;grid-row:2;display:none;gap:2px;min-width:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:0 0 auto;white-space:nowrap;padding:6px 9px;font-size:.76rem}
  .topbar .actions{grid-column:2;grid-row:1}
}

.page{position:relative;z-index:10;max-width:680px;margin:0 auto;padding:120px 24px 80px;min-height:100vh;animation:pageIn .5s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:100px 18px 60px}}

.hero{padding-bottom:32px;border-bottom:1px solid var(--border);margin-bottom:32px;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);background:var(--mint-soft);padding:7px 14px;border-radius:100px;margin-bottom:22px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
.hero-title{font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:900;letter-spacing:-.038em;line-height:1.08;color:var(--ink);margin-bottom:16px;}
.hero-title em{font-style:normal;background:linear-gradient(120deg,#34D399 0%,#60A5FA 50%,#A78BFA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-lede{font-size:1.02rem;line-height:1.7;color:var(--ink-2);max-width:540px;margin-bottom:20px;}
.hero-lede strong{color:var(--ink);font-weight:600}
.hero-progress{display:flex;gap:8px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--border);}
.progress-chip{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;color:var(--ink-2);letter-spacing:-.005em;text-decoration:none;transition:all .22s var(--ease);}
a.progress-chip:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,20,43,.06);}
.progress-chip svg{width:13px;height:13px;color:var(--ink-3)}
.progress-chip strong{color:var(--ink);font-weight:700}
.progress-chip[data-tone="daily"]{border-color:rgba(245,158,11,.28);background:var(--amber-soft)}
.progress-chip[data-tone="daily"] svg{color:var(--amber)}
.progress-chip[data-tone="guide"]{border-color:rgba(139,92,246,.28);background:var(--lavender-soft)}
.progress-chip[data-tone="guide"] svg{color:var(--lavender-2)}
.progress-chip[data-tone="spot"]{border-color:rgba(16,185,129,.28);background:var(--mint-soft)}
.progress-chip[data-tone="spot"] svg{color:var(--mint)}
.progress-chip[data-tone="score"]{border-color:rgba(96,165,250,.28);background:var(--sky-soft)}
.progress-chip[data-tone="score"] svg{color:var(--sky)}
.progress-chip[data-tone="recover"]{border-color:rgba(239,68,68,.24);background:var(--rose-soft)}
.progress-chip[data-tone="recover"] svg{color:var(--rose)}

.difficulty-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;}
.diff-tile{padding:11px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);position:relative;overflow:hidden;}
.diff-tile-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;}
.diff-tile-name{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
.diff-tile-count{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;color:var(--ink-3);}
.diff-tile-bar{height:3px;border-radius:100px;background:color-mix(in srgb,var(--ink-3) 18%,transparent);overflow:hidden;}
.diff-tile-fill{height:100%;border-radius:100px;transition:width .7s var(--ease);}
.diff-tile[data-level="easy"] .diff-tile-fill{background:var(--mint)}
.diff-tile[data-level="medium"] .diff-tile-fill{background:var(--amber)}
.diff-tile[data-level="hard"] .diff-tile-fill{background:var(--rose)}

.msg-wrap{margin-top:24px;animation:msgIn .5s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-meta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.msg-cat-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg-cat{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:100px;}
.msg-cat[data-cat="reward"]{color:var(--mint);background:var(--mint-soft)}
.msg-cat[data-cat="fear"]{color:var(--rose);background:var(--rose-soft)}
.msg-cat[data-cat="authority"]{color:var(--amber);background:var(--amber-soft)}
.msg-cat[data-cat="trust"]{color:var(--sky);background:var(--sky-soft)}
.msg-cat[data-cat="urgency"]{color:var(--lavender-2);background:var(--lavender-soft)}
.msg-cat .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.diff-badge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:100px;}
.diff-badge[data-level="easy"]{color:var(--mint);background:var(--mint-soft);border:1px solid rgba(16,185,129,.3)}
.diff-badge[data-level="medium"]{color:var(--amber);background:var(--amber-soft);border:1px solid rgba(245,158,11,.3)}
.diff-badge[data-level="hard"]{color:var(--rose);background:var(--rose-soft);border:1px solid rgba(239,68,68,.3)}
.diff-badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.msg-num{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:600;color:var(--ink-3);letter-spacing:.05em;}

.phone{width:100%;border-radius:22px;background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 50px rgba(20,20,43,.08),inset 0 1px 0 rgba(255,255,255,.9);padding:22px 24px 20px;text-align:left;position:relative;overflow:hidden;}
[data-theme="dark"] .phone{box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);}
.phone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.phone-app{display:flex;align-items:center;gap:10px}
.phone-app-icon{width:32px;height:32px;border-radius:9px;overflow:hidden;flex-shrink:0;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(255,255,255,.06);font-size:1rem;display:flex;align-items:center;justify-content:center}
.phone-app-name{font-size:.88rem;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.phone-time{font-size:.72rem;font-weight:500;color:var(--ink-3);font-family:'JetBrains Mono',monospace;}
.phone-sender{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.phone-sender-name{font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.phone-sender-tag{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:100px;color:var(--amber);background:var(--amber-soft);}
.phone-msg{font-size:1rem;line-height:1.65;color:var(--ink-2);letter-spacing:-.003em;margin-bottom:8px;}
.phone-msg strong{color:var(--ink);font-weight:600}
.phone-msg em{font-style:normal;color:var(--lavender-2);font-weight:600;word-break:break-all;}
.phone-foot{display:flex;align-items:center;gap:9px;padding-top:14px;margin-top:8px;border-top:1px solid var(--border);font-size:.74rem;color:var(--ink-3);font-family:'JetBrains Mono',monospace;}
.phone-foot-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);flex-shrink:0;animation:livePulse 2.4s ease-in-out infinite;}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 3px var(--amber-soft)}50%{box-shadow:0 0 0 5px rgba(245,158,11,.15)}}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.choice{position:relative;text-align:left;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;color:var(--ink);font-family:inherit;font-size:.94rem;font-weight:500;line-height:1.45;cursor:pointer;transition:all .25s var(--ease);display:flex;align-items:center;gap:14px;width:100%;}
.choice::before{content:attr(data-key);flex-shrink:0;width:24px;height:24px;border-radius:7px;background:color-mix(in srgb,var(--ink-3) 12%,transparent);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--ink-3);transition:all .25s var(--ease);}
.choice:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,20,43,.06);}
.choice:hover::before{background:linear-gradient(135deg,var(--lavender-2),var(--sky));color:#fff;}

/* ═══════════════ FLASHCARD FLOW ═══════════════ */
.fc-wrap{animation:fcIn .4s var(--ease) both;margin-top:24px}
@keyframes fcIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.fc-topbar{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:20px;}
.fc-exit{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;line-height:1;transition:all .2s var(--ease);padding:0 0 2px 0;}
.fc-exit:hover{color:var(--rose);border-color:var(--rose);transform:translateY(-1px)}
.fc-progress{display:flex;gap:6px;align-items:center}
.fc-progress-seg{flex:1;height:7px;border-radius:100px;background:color-mix(in srgb,var(--ink-3) 18%,transparent);transition:background .3s var(--ease);}
.fc-progress-seg.done{background:var(--mint)}
.fc-progress-seg.current{background:var(--lavender-2);box-shadow:0 0 8px rgba(139,92,246,.4)}
.fc-count{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--ink-3);white-space:nowrap;}

.fc-card{padding:32px 28px;border-radius:22px;background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 50px rgba(20,20,43,.06);text-align:center;}
[data-theme="dark"] .fc-card{box-shadow:0 20px 50px rgba(0,0,0,.4)}
.fc-card.verdict{background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 8%,var(--surface)),color-mix(in srgb,var(--lavender-2) 5%,var(--surface)));}
.fc-card.verdict.wrong{background:linear-gradient(135deg,color-mix(in srgb,var(--rose) 8%,var(--surface)),color-mix(in srgb,var(--amber) 5%,var(--surface)));}

.fc-emoji{font-size:3.6rem;line-height:1;margin-bottom:14px;animation:fcEmojiIn .6s var(--ease) both .05s;}
@keyframes fcEmojiIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.fc-title{font-size:clamp(1.3rem,4vw,1.65rem);font-weight:900;letter-spacing:-.03em;line-height:1.15;color:var(--ink);margin-bottom:14px;}
.fc-body{font-size:1rem;line-height:1.65;color:var(--ink-2);max-width:520px;margin:0 auto;}
.fc-body.center{text-align:center}
.fc-body strong{color:var(--ink);font-weight:700}

.fc-context{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px;}

.fc-signals{display:flex;flex-direction:column;gap:12px;text-align:left;max-width:560px;margin:0 auto;}
.fc-signal{display:flex;gap:14px;align-items:flex-start;padding:15px 17px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);}
.fc-signal-num{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:800;}
.fc-signal-text{flex:1;min-width:0}
.fc-signal-name{font-size:.92rem;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:-.005em;}
.fc-signal-detail{font-size:.88rem;line-height:1.55;color:var(--ink-2)}

.fc-sections{display:flex;flex-direction:column;gap:14px;text-align:left;max-width:560px;margin:0 auto;}
.fc-section{padding:16px 18px;border-radius:14px;border:1px solid}
.fc-section.stakes{background:var(--rose-soft);border-color:rgba(239,68,68,.22)}
.fc-section.verify{background:var(--mint-soft);border-color:rgba(16,185,129,.22)}
.fc-section.lever{background:var(--lavender-soft);border-color:rgba(139,92,246,.22)}
.fc-section-head{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.fc-section-head svg{width:14px;height:14px}
.fc-section.stakes .fc-section-head{color:var(--rose)}
.fc-section.verify .fc-section-head{color:var(--mint)}
.fc-section.lever .fc-section-head{color:var(--lavender-2)}
.fc-section p{font-size:.9rem;line-height:1.6;color:var(--ink-2);margin:0}
.fc-section p strong{color:var(--ink);font-weight:700}

.fc-footer{display:flex;flex-direction:column;gap:10px;margin-top:22px;align-items:center;}
.fc-continue{width:100%;max-width:420px;padding:15px 22px;border-radius:14px;background:var(--lime);color:var(--ink);border:none;font-family:inherit;font-size:1rem;font-weight:800;letter-spacing:-.01em;cursor:pointer;box-shadow:0 5px 0 #9CCC38, 0 6px 20px var(--lime-glow);transition:transform .1s ease,box-shadow .1s ease,background .15s ease;}
.fc-continue:hover{background:var(--lime-hover);transform:translateY(-1px);box-shadow:0 6px 0 #9CCC38, 0 10px 28px var(--lime-glow);}
.fc-continue:active{transform:translateY(3px);box-shadow:0 2px 0 #9CCC38;}
[data-theme="dark"] .fc-continue{background:#87965F;color:#121217;box-shadow:0 5px 0 #6A7748;}
[data-theme="dark"] .fc-continue:hover{background:#96A66B}
.fc-skip{background:none;border:none;font-family:inherit;font-size:.8rem;color:var(--ink-3);cursor:pointer;padding:4px 8px;transition:color .2s var(--ease);}
.fc-skip:hover{color:var(--ink)}

.comeback{text-align:center;padding:32px 28px;border-radius:20px;background:linear-gradient(135deg,rgba(199,245,72,.08),rgba(52,211,153,.06));border:1px solid rgba(199,245,72,.3);margin-top:24px;animation:fcIn .5s var(--ease);}
.comeback-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--lime),#34D399);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 24px var(--lime-glow);}
.comeback-icon svg{width:26px;height:26px;color:var(--ink)}
.comeback-title{font-size:1.25rem;font-weight:800;letter-spacing:-.025em;color:var(--ink);margin-bottom:10px;line-height:1.25;}
.comeback-sub{font-size:.94rem;color:var(--ink-2);line-height:1.65;max-width:400px;margin:0 auto 22px;}
.comeback-sub strong{color:var(--ink);font-weight:600}
.comeback-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.complete{text-align:center;padding:20px 0;animation:fcIn .6s var(--ease)}
.complete-icon{width:80px;height:80px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,var(--mint-soft),var(--lavender-soft));border:1px solid rgba(16,185,129,.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(16,185,129,.2);}
.complete-icon svg{width:36px;height:36px;color:var(--mint)}
.complete-title{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-bottom:14px;color:var(--ink);}
.complete-sub{font-size:1rem;color:var(--ink-2);line-height:1.7;max-width:440px;margin:0 auto 32px;}
.complete-sub strong{color:var(--ink);font-weight:600}
.complete-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px;margin:0 auto 32px;}
.stat{padding:18px 12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;text-align:center;}
.stat-v{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,var(--lavender-2),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin-bottom:6px;}
.stat-l{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}

.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 24px;border-radius:100px;font-family:inherit;font-size:.94rem;font-weight:600;border:none;cursor:pointer;text-decoration:none;transition:all .25s var(--ease);justify-content:center;}
.btn svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.btn-primary{background:var(--lime);color:var(--ink);box-shadow:0 6px 20px var(--lime-glow);font-weight:700;flex:1;min-width:200px;}
.btn-primary:hover{background:var(--lime-hover);transform:translateY(-2px);box-shadow:0 12px 30px var(--lime-glow);}
[data-theme="dark"] .btn-primary{background:#87965F;color:#121217;box-shadow:0 4px 12px rgba(135,150,95,.16);}
[data-theme="dark"] .btn-primary:hover{background:#96A66B;box-shadow:0 8px 18px rgba(135,150,95,.2);}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--border-strong);transform:translateY(-2px)}

.footer{margin-top:56px;padding-top:28px;border-top:1px solid var(--border);text-align:center;font-size:.82rem;color:var(--ink-3);line-height:1.7;}
.footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
.footer a{color:var(--ink-3);text-decoration:none;transition:color .2s var(--ease)}
.footer a:hover{color:var(--ink)}
.footer-meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.02em;color:var(--ink-4);}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
</style>

<script>
(() => {
  'use strict';

  // ═══════════════ SCENARIOS ═══════════════
  const SCENARIOS = [
    { id:'sars-refund', difficulty:'easy', category:'reward', catLabel:'Reward scam', guideSection:'3', channel:'SMS', sender:'+27 82 447 0199', senderLabel:'Unknown number', time:'14:22',
      message:'<strong>SARS</strong>: You have a pending tax refund of R4,280. Verify your banking details to receive payment: <em>sars-refund-za.co.za</em>',
      signals:[
        {name:'Wrong domain',detail:'The real SARS site is sars.gov.za. This one has an extra word — "refund" — and ends in .co.za, not .gov.za.'},
        {name:'Unknown sender',detail:'SARS contacts taxpayers through eFiling and official post. Not random mobile numbers.'},
        {name:'Money you didn\'t expect',detail:'"Pending refund" is one of the oldest hooks. Money waiting for you feels like something to claim, not something to check.'},
        {name:'Link to claim',detail:'Real refunds are claimed inside eFiling. If a message gives you a link to receive money, that link is the entire trap.'}
      ],
      choices:[{label:'Tap the link and verify my banking details.',safe:false},{label:'Open the SARS eFiling portal myself.',safe:true}],
      safeResult:{title:'You bypassed the channel.',body:'You opened the real portal on your own terms, not through a link in a message. That two-second decision is the whole defence. There is no refund waiting — there never was.'},
      unsafeResult:{title:'The page was built for one thing.',body:'It accepted your details and sent them to an attacker. A real SARS refund arrives in eFiling, not via a link — you never need to click anything to receive one.'},
      stakes:'Your banking details, ID number, and login to your SARS eFiling account. From there, an attacker can file returns in your name and redirect any future refunds.',
      verify:'Type sars.gov.za into your browser directly. Log in. Check for any pending refund. It will show up there if it\'s real.',
      lever:'reward',
      leverExplain:'The attacker is offering you something you want. A refund, a prize, a benefit — anything that pulls you toward a reward makes you skip the small doubt that would otherwise make you check the URL.'
    },
    { id:'vodacom-airtime', difficulty:'easy', category:'reward', catLabel:'Free reward', guideSection:'3', channel:'SMS', sender:'Vodacom', senderLabel:'Vodacom', time:'16:33',
      message:'You have <strong>unclaimed airtime of R500</strong> from our 2026 promotion. Claim before it expires in 24 hours: <em>vodacom-rewards.co.za</em>',
      signals:[
        {name:'Spoofed sender name',detail:'Any sender name can be set in an SMS. "Vodacom" at the top of your screen proves nothing.'},
        {name:'Wrong domain',detail:'Vodacom uses vodacom.co.za. vodacom-rewards.co.za is a lookalike.'},
        {name:'24-hour deadline',detail:'A short deadline is designed to make you act before you check. Real promotions run for weeks.'},
        {name:'Free money framing',detail:'Rewards trigger desire. Desire makes you click. Everything about this message is built around that.'}
      ],
      choices:[{label:'Claim it — it says Vodacom right there.',safe:false},{label:'Check the My Vodacom app for the promotion.',safe:true}],
      safeResult:{title:'You checked the app.',body:'No promotion waiting. Vodacom would not deliver a reward through a lookalike domain. Rewards requiring action within 24 hours are designed to make you skip checking — which is what you just did.'},
      unsafeResult:{title:'The page asked for your ID.',body:'A "reward claim" that asks for your ID number and card details is not a reward. It\'s a data collection page dressed as one. The R500 doesn\'t exist.'},
      stakes:'Your ID number, phone number, and card details. Free rewards are one of the most effective baits for collecting personal data.',
      verify:'Open the My Vodacom app. Real promotions are always visible there, never only in a text message.',
      lever:'reward',
      leverExplain:'Anything free creates an urge to act before thinking. Attackers exploit that gap by adding a deadline, so the urge becomes a decision before doubt can appear.'
    },
    { id:'microsoft-verify', difficulty:'easy', category:'fear', catLabel:'Fake security alert', guideSection:'3', channel:'Email', sender:'noreply@microsoft-account-verify.com', senderLabel:'Microsoft', time:'11:14',
      message:'Unusual sign-in attempt detected. Someone tried to log into your Microsoft account from <strong>Lagos, Nigeria</strong>. If this wasn\'t you, secure your account immediately.',
      signals:[
        {name:'Domain not microsoft.com',detail:'microsoft-account-verify.com is not microsoft.com. Microsoft runs security notices from their own domain, never a lookalike.'},
        {name:'Foreign location trigger',detail:'A specific distant city makes the threat feel real and specific. Attackers choose exotic locations because they work.'},
        {name:'Urgency built in',detail:'"Secure your account immediately" is designed to skip the ten seconds it would take to check the sender.'},
        {name:'Plausible scenario',detail:'Unusual sign-in alerts are real — Microsoft does send them. That\'s exactly why the fake one works.'}
      ],
      choices:[{label:'Secure my account — someone is trying to get in.',safe:false},{label:'Log into account.microsoft.com in a new tab.',safe:true}],
      safeResult:{title:'You went to the source.',body:'Logging in through the real Microsoft portal shows the truth: no suspicious activity, because it never happened. The "unusual sign-in" was itself the bait.'},
      unsafeResult:{title:'The page looked like Microsoft.',body:'Logo, fonts, layout — all copied. What it didn\'t have was the real domain. Your email and password were captured in the four seconds you were on that page.'},
      stakes:'Your email account. From there, an attacker can reset every other account tied to that email — banking, social, work, everything.',
      verify:'Go to account.microsoft.com by typing it. Look at your recent activity. Any real alert will show up there.',
      lever:'fear',
      leverExplain:'When you believe someone is already in your account, checking feels like a waste of time. Fear turns "verify" into "react" — and reacting is exactly what the attacker needs.'
    },
    { id:'standard-bank-blocked', difficulty:'easy', category:'fear', catLabel:'Account locked', guideSection:'3', channel:'SMS', sender:'+27 84 662 1177', senderLabel:'Unknown number', time:'07:02',
      message:'Your Standard Bank card has been <strong>blocked</strong> for security reasons. Call 087 345 0199 to unblock.',
      signals:[
        {name:'Wrong number',detail:'Standard Bank\'s real number is on the back of your card. A number in an SMS can be anything.'},
        {name:'Blocked card fear',detail:'Nobody wants a blocked card. The fear makes you want to call before you think.'},
        {name:'Urgency without context',detail:'No mention of why, no reference number, no way to check in the app. Real banks always give you context first.'},
        {name:'Callback trap',detail:'The number leads to a call centre built to walk you through "verification" — which means your PIN and passwords.'}
      ],
      choices:[{label:'Call the number — my card might really be blocked.',safe:false},{label:'Open the banking app and check the card status.',safe:true}],
      safeResult:{title:'You opened the app.',body:'Your card is fine. The number in the message would have reached a call centre set up to walk you through verification — which means your PIN and your banking passwords.'},
      unsafeResult:{title:'The call was calm and professional.',body:'The person knew your name, your branch, and your card type. They asked for your PIN "to verify you\'re the account holder." No bank asks for your PIN. Not ever.'},
      stakes:'Your card PIN, your online banking password, and full access to your account.',
      verify:'Open the Standard Bank app. Check the card status there. If the card is fine, the message was fake.',
      lever:'fear',
      leverExplain:'A blocked card means you can\'t pay for anything. That\'s a real problem, and real problems make people act fast. The attacker relies on that reaction — the fast call is the trap.'
    },
    { id:'parcel-customs', difficulty:'easy', category:'urgency', catLabel:'Delivery fee scam', guideSection:'3', channel:'SMS', sender:'+27 66 402 9188', senderLabel:'Unknown number', time:'11:38',
      message:'Your parcel is <strong>held at customs</strong>. A handling fee of R35 is required before delivery. Pay within 48 hours or the parcel is returned: <em>sapost-clearance.co.za</em>',
      signals:[
        {name:'Wrong domain',detail:'SAPO uses sapo.co.za. sapost-clearance.co.za is a lookalike — the extra word "clearance" is the only thing between you and the real site.'},
        {name:'Small fee, big goal',detail:'R35 is small enough to feel worth paying. The trap is your card details, not the fee.'},
        {name:'48-hour deadline',detail:'Real customs holds give you more time and come through proper channels, not texts from unknown numbers.'},
        {name:'"Your parcel"',detail:'No tracking number, no description, no sender. If you\'re expecting something, it feels targeted; if you\'re not, curiosity fills the gap.'}
      ],
      choices:[{label:'Pay the R35 to release the parcel.',safe:false},{label:'Check the tracking through the real courier or SAPO.',safe:true}],
      safeResult:{title:'You checked.',body:'No parcel waiting. Nothing held. Real customs issues go through the courier\'s official tracking page, never a payment link in an SMS.'},
      unsafeResult:{title:'R35 was the bait.',body:'The payment page captured your full card details. The R35 was a real charge — the attackers sold your card on within hours.'},
      stakes:'Your full card details. A small fee that feels worth paying is one of the most reliable ways to get them.',
      verify:'Look up your tracking number on the courier\'s official site. If there\'s no tracking number, there\'s no parcel.',
      lever:'urgency',
      leverExplain:'A small fee plus a deadline feels like something to just pay. The amount is small enough that questioning it feels like overkill — which is exactly why it works.'
    },
    { id:'nsfas-allowance-delay', difficulty:'easy', category:'urgency', catLabel:'NSFAS scam', guideSection:'4', channel:'SMS', sender:'+27 61 447 0199', senderLabel:'Unknown number', time:'08:14',
      message:'<strong>NSFAS</strong>: Your R5,750 allowance is delayed due to verification issues. Confirm your student number and banking details within 24 hours or payment will be cancelled: <em>nsfas-verify.co.za</em>',
      signals:[
        {name:'NSFAS doesn\'t text links',detail:'NSFAS communicates through the myNSFAS portal and your institution\'s student portal. They never ask you to verify bank details via a random SMS link.'},
        {name:'Exact amount creates panic',detail:'Naming the exact figure (R5,750) makes it feel real and urgent — that\'s deliberate. It stops you from pausing to check.'},
        {name:'24-hour deadline',detail:'A short deadline is a pressure tactic. Real NSFAS payment delays are resolved inside the portal, not via a text message.'},
        {name:'Wrong domain',detail:'nsfas-verify.co.za is not nsfas.org.za — the official NSFAS site. The extra word "verify" is the giveaway.'}
      ],
      choices:[{label:'Click the link before the deadline to secure my payment.',safe:false},{label:'Log into myNSFAS.org.za directly to check my status.',safe:true}],
      safeResult:{title:'You went straight to the source.',body:'myNSFAS.org.za shows your real status. There is no verification issue waiting. A real NSFAS delay is resolved inside the portal — you never need to click a link in a text message to fix it.'},
      unsafeResult:{title:'The page asked for your bank details.',body:'It copied the myNSFAS login screen almost perfectly. Your student number and banking details went straight to the attacker. The R5,750 delay doesn\'t exist — it was invented to make you act fast.'},
      stakes:'Your banking details, ID number, and student login. From there, an attacker can hijack your allowance payments and apply for funding in your name.',
      verify:'Type nsfas.org.za into your browser yourself or open the student portal at your institution. Any real NSFAS notice will appear there.',
      lever:'urgency',
      leverExplain:'A delayed payment is a real problem. That is exactly why the attacker uses it — a problem with a deadline feels like something to solve immediately, not something to verify.'
    },
    { id:'nsfas-laptop-claim', difficulty:'easy', category:'reward', catLabel:'Free laptop scam', guideSection:'4', channel:'WhatsApp', sender:'+27 72 883 4410', senderLabel:'Unknown number', time:'12:44',
      message:'🎉 Congratulations! You qualify for the <strong>2026 NSFAS laptop programme</strong>. Pay a R250 courier fee to receive your device. Reply with your ID number, student number and delivery address.',
      signals:[
        {name:'You did not apply',detail:'Winning something you never entered for is the oldest hook in the book. If you didn\'t apply, you didn\'t win.'},
        {name:'Delivery fee required',detail:'NSFAS devices are distributed through your institution, free of charge. No legitimate programme asks for a courier fee.'},
        {name:'Sensitive info asked upfront',detail:'ID number + student number + address in one message is a data-harvesting request, not a delivery confirmation.'},
        {name:'WhatsApp as the channel',detail:'NSFAS does not run laptop giveaways over WhatsApp. All legitimate NSFAS communication goes through the portal.'}
      ],
      choices:[{label:'Send my details and pay the courier fee.',safe:false},{label:'Check with my institution\'s financial aid office first.',safe:true}],
      safeResult:{title:'You asked the source.',body:'There is no 2026 NSFAS laptop programme. The financial aid office confirms it. And you didn\'t hand your ID number to a stranger on WhatsApp.'},
      unsafeResult:{title:'You sent everything and paid R250.',body:'Your ID number, student number, and address are now on a scammer\'s list. The R250 was just the first request — more "fees" would have followed. The laptop never existed.'},
      stakes:'Your full identity plus the courier fee. The ID number alone can be used to open fraudulent accounts or take out loans in your name.',
      verify:'Call or visit your institution\'s financial aid office. Any real NSFAS device programme is announced there and through the portal.',
      lever:'reward',
      leverExplain:'A free laptop is the kind of thing that makes you reply before you think. The small fee makes it feel affordable — so the offer skips the check you would normally apply.'
    },
    { id:'textbook-seller', difficulty:'easy', category:'trust', catLabel:'Textbook scam', guideSection:'4', channel:'WhatsApp', sender:'+27 82 611 8403', senderLabel:'Unknown number', time:'11:38',
      message:'Hey, I saw your post in the class group. I have <strong>Intro to Accounting 3rd edition</strong> for R180. EFT and I\'ll send the PDF tonight. I\'ve sold to other students in your class.',
      signals:[
        {name:'EFTs are irreversible',detail:'Once you send money by EFT, you can\'t get it back. This is why scammers love it.'},
        {name:'"Sold to other students"',detail:'Naming your class as proof is designed to make the offer feel vouched for. Anyone can claim this.'},
        {name:'PDF for a physical textbook price',detail:'If it\'s a PDF, why is it priced like a printed book? The "physical" price plus digital delivery doesn\'t add up.'},
        {name:'No way to verify',detail:'You don\'t know this person. You can\'t check their history, and they aren\'t in your class group with a real name.'}
      ],
      choices:[{label:'Pay by EFT — R180 is a good price.',safe:false},{label:'Ask to meet on campus to inspect the book first.',safe:true}],
      safeResult:{title:'You asked to meet.',body:'The seller went quiet. Real textbook sellers are happy to meet on campus or share a real photo of the book. Silence after that question means the "book" never existed.'},
      unsafeResult:{title:'You paid by EFT.',body:'The PDF never arrived. The number blocked you within an hour. The "class group" seller was never in your class at all.'},
      stakes:'R180 with no textbook delivered — and your number added to a list of students who pay quickly.',
      verify:'Ask to meet in person on campus or see a photo of the physical book with the current date written on a piece of paper. Legitimate sellers do this happily.',
      lever:'trust',
      leverExplain:'Trust from a class group feels different from trust in a stranger. Attackers insert themselves into the places you already believe in — and your guard drops.'
    },
    { id:'real-nsfas-notice', difficulty:'easy', category:'authority', catLabel:'Legit NSFAS notice', guideSection:'4', channel:'SMS', sender:'NSFAS', senderLabel:'NSFAS', time:'09:11',
      message:'NSFAS: Your 2026 allowance has been processed and will reflect in your registered bank account within 3 working days. No action needed. For queries, log into myNSFAS.org.za',
      signals:[
        {name:'No link to click',detail:'A real payment notification tells you what happened and where to check — it doesn\'t ask you to click anything.'},
        {name:'No info requested',detail:'NSFAS already has your details on file. Real messages never ask for ID, bank details, or verification.'},
        {name:'Correct official domain',detail:'myNSFAS.org.za is the real portal. That\'s where you go if you want to verify.'},
        {name:'Reasonable timeline',detail:'"Within 3 working days" is realistic. Scam messages use extreme urgency like "24 hours".'}
      ],
      choices:[{label:'This looks suspicious — I should report it as a scam.',safe:false},{label:'This looks like a real NSFAS notification.',safe:true}],
      safeResult:{title:'You called it correctly.',body:'This is what a real NSFAS message looks like: no link, no data requested, official domain, reasonable timeline. Recognising legitimate messages is just as important as spotting fakes.'},
      unsafeResult:{title:'You treated a real notification as a scam.',body:'Real messages are calm, contain no links, and ask you for nothing. If you report those as scams, you miss actual payments. The trick is not "everything is a scam" — it\'s "does this ask me to do something unsafe?"'},
      stakes:'Nothing — this is a legitimate notification. No money, no data, no action required.',
      verify:'If unsure, log into myNSFAS.org.za directly and confirm your status. It will match the message.',
      lever:'authority',
      leverExplain:'Real institutions send real messages. The trick is learning to tell the calm, informative ones from the pressured, link-bearing ones — because not every message is a scam.'
    },
    { id:'real-campus-notice', difficulty:'easy', category:'urgency', catLabel:'Legit campus notice', guideSection:'4', channel:'Email', sender:'library@uj.ac.za', senderLabel:'UJ Library', time:'08:00',
      message:'Reminder: Your library book "Principles of Marketing" is due for return on Friday. Renew online via the library portal or return it in person to avoid a fine. Log in at uj.ac.za/library.',
      signals:[
        {name:'Uses your institution\'s real domain',detail:'uj.ac.za is the real UJ domain. The email is from the university itself.'},
        {name:'Points to the official portal',detail:'The instruction is to log into uj.ac.za/library yourself — not a random link in the email.'},
        {name:'Reasonable request',detail:'Returning a library book is a normal, boring, expected request. It doesn\'t create panic or offer a reward.'},
        {name:'No personal info requested',detail:'The library already knows who you are. They don\'t need to verify your identity.'}
      ],
      choices:[{label:'This might be a phishing attempt — I should be careful.',safe:false},{label:'This looks like a normal library reminder.',safe:true}],
      safeResult:{title:'You got it right.',body:'A calm reminder from your own institution, pointing you to a portal you already trust, asking nothing of you. This is what a safe, legitimate message looks like.'},
      unsafeResult:{title:'You were overly cautious.',body:'Real notices use your institution\'s domain, ask for nothing, and don\'t pressure you. Reporting normal university email as phishing wastes the IT team\'s time and misses the real scams.'},

      lever:'urgency',

  // ═══════════════ CONFIG ═══════════════
  const POINTS      = { easy:10, medium:20, hard:30 };
  const DAILY_LIMIT = 5;
  const STORE_KEY   = 'cyberwise.spot.v1';

  const LEVERS = { reward:'Reward', fear:'Fear', authority:'Authority', trust:'Trust', urgency:'Urgency' };

  const CHANNELS = {
    'SMS':          { foot:'Delivered' },
    'Email':        { foot:'Not from your contacts' },
    'WhatsApp':     { foot:'Online' },
    'Instagram DM': { foot:'Message request' },
    'USB':          { foot:'Removable drive' },
    'QR code':      { foot:'Scanned link' }
  };

  const GUIDE_TITLES = {
    '1':'What cybersecurity awareness means','2':'Threats everyone should recognise','3':'Essential protection practices',
    '4':'Cybersecurity for students','5':'Safe practices for children and teens','6':'Safe use of AI tools',
    '7':'For organisations, schools, and businesses','8':'Being a good digital citizen','9':'If something goes wrong',
    '10':'Test yourself','11':'Daily checklist and golden rules','12':'Glossary','13':'Additional resources'
  };

  const ICONS = {
    flame:'<path d="M12 22a7 7 0 0 0 7-7c0-5-7-13-7-13S5 10 5 15a7 7 0 0 0 7 7Z"/>',
    star:'<path d="m12 3.5 2.5 5.4 5.9.8-4.3 4.1 1 5.9-5.1-2.8-5.1 2.8 1-5.9-4.3-4.1 5.9-.8Z"/>',
    alert:'<path d="M12 3.5 2.5 20h19L12 3.5Z"/><line x1="12" y1="9.5" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.1"/>',
    shieldAlert:'<path d="M12 3 20 6v6c0 5-3.6 8.2-8 9.4C7.6 20.2 4 17 4 12V6Z"/><line x1="12" y1="9" x2="12" y2="13.5"/><line x1="12" y1="16.5" x2="12" y2="16.6"/>',
    checkCircle:'<circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.8 2.8 5.2-6"/>',
    target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>',
    arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.2"/>',
    check:'<path d="m5 12.8 4.6 4.6L19 6.6"/>',
    book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4Z"/><path d="M20 4h-3a4 4 0 0 0-4 4v12a2.5 2.5 0 0 1 2.5-2.5H20Z"/>',
    shield:'<path d="M12 2 20 6v6c0 5-3.6 8.2-8 9.4C7.6 20.2 4 17 4 12V6Z"/>'
  };

  function ic(name, w){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  const APP_ICONS = {
    'SMS':{emoji:'💬',name:'Messages'},'Messages':{emoji:'💬',name:'Messages'},
    'Email':{emoji:'📧',name:'Mail'},'Mail':{emoji:'📧',name:'Mail'},
    'WhatsApp':{emoji:'💚',name:'WhatsApp'},
    'Instagram':{emoji:'📸',name:'Instagram'},'Instagram DM':{emoji:'📸',name:'Instagram'},
    'USB':{emoji:'💾',name:'Files'},'Files':{emoji:'💾',name:'Files'},
    'QR code':{emoji:'📷',name:'Camera'},'Camera':{emoji:'📷',name:'Camera'},
    'Phone call':{emoji:'📞',name:'Phone'},'Browser':{emoji:'🌐',name:'Browser'}
  };
  function appIconHTML(channel){ const meta = APP_ICONS[channel] || APP_ICONS.SMS; return meta.emoji; }
  function appName(channel){ const meta = APP_ICONS[channel] || APP_ICONS.SMS; return meta.name; }

  const pad = n => String(n).padStart(2, '0');

  function shuffleArr(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function todayStr(d){ const x = d ? new Date(d) : new Date(); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); }
  function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate() - 1); return todayStr(d); }

  let state = loadState();
  function loadState(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { raw = null; }
    const s = Object.assign({
      score:0, correct:0, wrong:0, streak:0, bestStreak:0,
      dayStreak:0, day:null, todayIds:[], answered:{},
      current:null, phase:'question', lastPick:null, bonus:false, shuffle:null, fcIndex:0
    }, raw && typeof raw === 'object' ? raw : {});
    if (!s.answered || typeof s.answered !== 'object') s.answered = {};
    if (!Array.isArray(s.todayIds)) s.todayIds = [];
    if (typeof s.bonus !== 'boolean') s.bonus = false;
    if (!Array.isArray(s.shuffle) || s.shuffle.length !== 2) s.shuffle = null;
    if (typeof s.fcIndex !== 'number' || s.fcIndex < 0) s.fcIndex = 0;
    if (s.phase !== 'flashcard') s.phase = 'question';
    if (s.day && s.day !== todayStr() && s.day !== yesterdayStr()) s.dayStreak = 0;
    return s;
  }
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function doneCount(){ return SCENARIOS.filter(s => state.answered[s.id]).length; }
  function allDone(){ return SCENARIOS.every(s => state.answered[s.id]); }
  function todaysCount(){ return state.day === todayStr() ? state.todayIds.length : 0; }
  function pickNext(){ const pool = SCENARIOS.filter(s => !state.answered[s.id]); if (!pool.length) return null; return pool[Math.floor(Math.random() * pool.length)]; }

  function currentScenario(){
    if (state.current){
      const sc = SCENARIOS.find(s => s.id === state.current);
      if (sc){
        if (state.phase === 'flashcard') return sc;
        if (!state.answered[sc.id]){
          if (!state.shuffle) state.shuffle = shuffleArr([0, 1]);
          return sc;
        }
      }
    }
    const next = pickNext();
    if (next){
      state.current  = next.id;
      state.phase    = 'question';
      state.lastPick = null;
      state.shuffle  = shuffleArr([0, 1]);
      state.fcIndex  = 0;
      save();
    }
    return next;
  }

  function touchDay(){
    const t = todayStr();
    if (state.day === t) return;
    state.dayStreak = (state.day === yesterdayStr()) ? (state.dayStreak || 0) + 1 : 1;
    state.day       = t;
    state.todayIds  = [];
    state.bonus     = false;
  }

  function readDaily(){
    let raw = {}; try { raw = JSON.parse(localStorage.getItem('cyberwise.daily.v1') || '{}') || {}; } catch (e) {}
    const history = raw.history || {};
    return { streak: typeof raw.streak === 'number' ? raw.streak : 0, hasProgress: Object.keys(history).length > 0 };
  }
  function readGuide(){
    let raw = {}; try { raw = JSON.parse(localStorage.getItem('cyberwise.guide.v1') || '{}') || {}; } catch (e) {}
    const read = raw.read || {};
    const ids = Object.keys(read).filter(k => read[k]);
    return { readCount: ids.length, hasProgress: ids.length > 0 };
  }
  function readRecovery(){
    let raw = {}; try { raw = JSON.parse(localStorage.getItem('cyberwise.recovery.v1') || '{}') || {}; } catch (e) {}
    const done = raw.done || {};
    const count = Object.keys(done).filter(k => done[k]).length;
    return { doneCount: count, hasProgress: !!raw.triage || count > 0 };
  }

  // ═══════════════ RENDER — HERO ═══════════════
  function heroHTML(){
    const done = doneCount(); const total = SCENARIOS.length; const left = Math.max(0, DAILY_LIMIT - todaysCount());
    const daily = readDaily(); const guide = readGuide(); const rec = readRecovery();
    let lede;
    if (done === 0) lede = 'Read each message the way you would on your phone — <strong>then decide</strong>. Five a day, real tactics, and a flashcard reveal that teaches you the signals.';
    else if (allDone()) lede = "You've seen every scenario. Come back to <strong>review the ones that caught you out</strong>, or help a friend spot their first one.";
    else if (left === 0) lede = "That's your five for today. <strong>Come back tomorrow</strong> for five fresh scenarios.";
    else lede = '<strong>' + left + ' scenario' + (left === 1 ? '' : 's') + ' left today.</strong> Every one is a real tactic used against South African students.';
    const chips = [];
    if (daily.streak > 0) chips.push('<a class="progress-chip" data-tone="daily" href="daily.html">' + ic('flame',2.4) + '<span>Daily: <strong>' + daily.streak + '</strong>-day streak</span></a>');
    if (guide.hasProgress) chips.push('<a class="progress-chip" data-tone="guide" href="guide.html">' + ic('book',2.4) + '<span>Guide: <strong>' + guide.readCount + '</strong> of 13</span></a>');
    if (done > 0) chips.push('<span class="progress-chip" data-tone="spot">' + ic('check',2.4) + '<span><strong>' + done + '</strong> of ' + total + ' seen</span></span>');
    if (state.score > 0) chips.push('<span class="progress-chip" data-tone="score">' + ic('star',2.4) + '<span><strong>' + state.score + '</strong> pts</span></span>');
    if (rec.hasProgress) chips.push('<a class="progress-chip" data-tone="recover" href="recovery.html">' + ic('shield',2.4) + '<span>Recovery: <strong>' + rec.doneCount + '</strong> steps</span></a>');
    const progressHTML = chips.length ? '<div class="hero-progress">' + chips.join('') + '</div>' : '';
    return '<section class="hero">' +
      '<div class="hero-eyebrow"><span class="dot"></span>Practise · ' + total + ' scenarios · 5 a day</div>' +
      '<h1 class="hero-title">Read it like it just <em>landed on your phone</em>.</h1>' +
      '<p class="hero-lede">' + lede + '</p>' + progressHTML + '</section>';
  }

  function difficultyHTML(){
    return '<div class="difficulty-bar">' +
      ['easy','medium','hard'].map(function(lvl){
        const inTier = SCENARIOS.filter(s => s.difficulty === lvl);
        const doneTier = inTier.filter(s => state.answered[s.id]).length;
        const p = inTier.length ? Math.round(doneTier / inTier.length * 100) : 0;
        return '<div class="diff-tile" data-level="' + lvl + '"><div class="diff-tile-top"><span class="diff-tile-name">' + lvl + '</span><span class="diff-tile-count">' + doneTier + '/' + inTier.length + '</span></div><div class="diff-tile-bar"><div class="diff-tile-fill" style="width:' + p + '%"></div></div></div>';
      }).join('') + '</div>';
  }

  function phoneHTML(sc){
    const ch = CHANNELS[sc.channel] || CHANNELS['SMS'];
    return '<div class="phone">' +
      '<div class="phone-head"><div class="phone-app"><div class="phone-app-icon" style="background:linear-gradient(135deg,var(--lavender-soft),var(--sky-soft));">' + appIconHTML(sc.channel) + '</div><div class="phone-app-name">' + appName(sc.channel) + '</div></div><div class="phone-time">' + (sc.time || '') + '</div></div>' +
      '<div class="phone-sender"><div class="phone-sender-name">' + sc.sender + '</div>' + (sc.senderLabel ? '<span class="phone-sender-tag">' + sc.senderLabel + '</span>' : '') + '</div>' +
      '<p class="phone-msg">' + sc.message + '</p>' +
      '<div class="phone-foot"><span class="phone-foot-dot"></span>' + (sc.foot || ch.foot) + '</div></div>';
  }

  function metaHTML(sc){
    const answered = !!state.answered[sc.id];
    const position = answered ? doneCount() : doneCount() + 1;
    return '<div class="msg-meta"><div class="msg-cat-row"><span class="msg-cat" data-cat="' + sc.category + '"><span class="dot"></span>' + sc.catLabel + '</span><span class="diff-badge" data-level="' + sc.difficulty + '"><span class="dot"></span>' + sc.difficulty + '</span></div><span class="msg-num">SCENARIO ' + pad(position) + ' / ' + SCENARIOS.length + '</span></div>';
  }

  function questionHTML(sc){
    const order = state.shuffle || [0, 1];
    const choices = order.map(function(origIdx, displayIdx){
      const c = sc.choices[origIdx];
      return '<button type="button" class="choice" data-choice="' + origIdx + '" data-key="' + (displayIdx + 1) + '">' + c.label + '</button>';
    }).join('');
    return '<section class="msg-wrap">' + metaHTML(sc) + phoneHTML(sc) + '<div class="choices">' + choices + '</div></section>';
  }

  // ═══════════════ FLASHCARD BUILDERS ═══════════════
  function buildFlashcards(sc, correct){
    const res = correct ? sc.safeResult : sc.unsafeResult;
    return [
      { type:'verdict', emoji: correct ? '🎉' : '💡', title: res.title, body: res.body },
      { type:'signals', title: correct ? 'What gave it away' : 'What you should have spotted', signals: sc.signals },
      { type:'protection', title: 'Protect yourself next time', stakes: sc.stakes, verify: sc.verify, lever: sc.lever, leverExplain: sc.leverExplain }
    ];
  }

  function renderFlashcard(sc){
    const rec = state.answered[sc.id] || { correct:false };
    const correct = !!rec.correct;
    const cards = buildFlashcards(sc, correct);
    const total = cards.length;
    if (state.fcIndex >= total) state.fcIndex = total - 1;
    const card = cards[state.fcIndex];
    const isLast = state.fcIndex === total - 1;

    const segments = cards.map(function(_, i){
      let cls = 'fc-progress-seg';
      if (i < state.fcIndex) cls += ' done';
      else if (i === state.fcIndex) cls += ' current';
      return '<div class="' + cls + '"></div>';
    }).join('');

    let cardHTML = '';
    if (card.type === 'verdict'){
      cardHTML = '<div class="fc-card verdict' + (correct ? '' : ' wrong') + '"><div class="fc-emoji">' + card.emoji + '</div><div class="fc-title">' + card.title + '</div><p class="fc-body center">' + card.body + '</p></div>';
    } else if (card.type === 'signals'){
      const signalsHTML = card.signals.map(function(s, i){
        return '<div class="fc-signal"><div class="fc-signal-num">' + pad(i + 1) + '</div><div class="fc-signal-text"><div class="fc-signal-name">' + s.name + '</div><div class="fc-signal-detail">' + s.detail + '</div></div></div>';
      }).join('');
      cardHTML = '<div class="fc-card"><div class="fc-context">' + sc.catLabel + ' · ' + sc.difficulty + '</div><div class="fc-title">' + card.title + '</div><div class="fc-signals">' + signalsHTML + '</div></div>';
    } else if (card.type === 'protection'){
      cardHTML = '<div class="fc-card">' +
        '<div class="fc-context">' + sc.catLabel + ' · ' + sc.difficulty + '</div>' +
        '<div class="fc-title">' + card.title + '</div>' +
        '<div class="fc-sections">' +
          '<div class="fc-section stakes"><div class="fc-section-head">' + ic('shieldAlert',2) + ' What was at stake</div><p>' + card.stakes + '</p></div>' +
          '<div class="fc-section verify"><div class="fc-section-head">' + ic('checkCircle',2) + ' How to verify</div><p>' + card.verify + '</p></div>' +
          '<div class="fc-section lever"><div class="fc-section-head">' + ic('target',2) + ' The lever used</div><p><strong>' + (LEVERS[card.lever] || card.lever) + ':</strong> ' + card.leverExplain + '</p></div>' +
        '</div>' +
      '</div>';
    }

    const footerHTML = '<div class="fc-footer"><button class="fc-continue" data-action="next-flashcard">' + (isLast ? 'Next scenario →' : 'Continue →') + '</button>' + (isLast ? '' : '<button class="fc-skip" data-action="skip-flashcards">Skip remaining cards</button>') + '</div>';

    return '<div class="fc-wrap"><div class="fc-topbar"><button class="fc-exit" data-action="exit-flashcards" aria-label="Exit">×</button><div class="fc-progress">' + segments + '</div><span class="fc-count">' + (state.fcIndex + 1) + ' / ' + total + '</span></div>' + cardHTML + footerHTML + '</div>';
  }

  function comebackHTML(){
    const todaySc = state.todayIds.map(id => SCENARIOS.find(s => s.id === id)).filter(Boolean);
    const right = todaySc.filter(s => state.answered[s.id] && state.answered[s.id].correct).length;
    const total = todaySc.length;
    const days = state.dayStreak || 1;
    const remaining = SCENARIOS.filter(s => !state.answered[s.id]).length;
    return '<div class="comeback"><div class="comeback-icon">' + ic('clock',2) + '</div><h2 class="comeback-title">That\'s your five for today.</h2><p class="comeback-sub">You called <strong>' + right + ' of ' + total + '</strong> correctly. Your streak is now <strong>' + days + ' ' + (days === 1 ? 'day' : 'days') + '</strong>. Come back tomorrow for five fresh scenarios — easy, medium and hard, in a new random order.</p><div class="comeback-actions">' + (remaining ? '<button type="button" class="btn btn-primary" data-action="keep-practising">Keep practising · bonus mode ' + ic('arrow',2) + '</button>' : '<a class="btn btn-primary" href="daily.html">Try today\'s Daily Phish ' + ic('arrow',2) + '</a>') + '<a class="btn btn-secondary" href="guide.html">Read the guide</a></div></div>';
  }

  function completeHTML(){
    const total = SCENARIOS.length;
    const attempted = state.correct + state.wrong;
    const acc = attempted ? Math.round(state.correct / attempted * 100) : 0;
    return '<div class="complete"><div class="complete-icon">' + ic('check',2) + '</div><h2 class="complete-title">You have seen every scenario.</h2><p class="complete-sub">You worked through all <strong>' + total + '</strong> messages — reward scams, fear tactics, authority impersonation, trust hijacks and urgency plays.</p><div class="complete-stats"><div class="stat"><div class="stat-v">' + acc + '%</div><div class="stat-l">Accuracy</div></div><div class="stat"><div class="stat-v">' + state.score + '</div><div class="stat-l">Points</div></div><div class="stat"><div class="stat-v">' + (state.bestStreak || 0) + '</div><div class="stat-l">Best streak</div></div></div><div class="comeback-actions"><a class="btn btn-primary" href="data_breach.html">Visit the Breach Lab ' + ic('arrow',2) + '</a><button type="button" class="btn btn-secondary" data-action="reset">Start over</button></div></div>';
  }

  function footerHTML(){
    return '<footer class="footer"><div class="footer-links"><a href="landing.html">Home</a><a href="guide.html">Guide</a><a href="daily.html">Daily</a><a href="data_breach.html">Breach Lab</a><a href="recovery.html">Recovery</a></div><div class="footer-meta">CyberWise · Spot the Phish · No accounts · No tracking</div></footer>';
  }

  function render(){
    const page = document.getElementById('page');
    let body;
    if (state.phase === 'flashcard' && state.current){
      const sc = SCENARIOS.find(s => s.id === state.current);
      body = sc ? renderFlashcard(sc) : comebackHTML();
    } else if (allDone()){
      body = completeHTML();
    } else if (todaysCount() >= DAILY_LIMIT && !state.bonus){
      body = comebackHTML();
    } else {
      const sc = currentScenario();
      body = sc ? questionHTML(sc) : completeHTML();
    }
    page.innerHTML = heroHTML() + difficultyHTML() + body + footerHTML();
  }

  function answer(index){
    if (state.phase !== 'question') return;
    const sc = currentScenario();
    if (!sc) return;
    const choice = sc.choices[index];
    if (!choice) return;
    touchDay();
    const inBonus = state.bonus === true;
    const correct = !!choice.safe;
    const pts = correct && !inBonus ? POINTS[sc.difficulty] : 0;
    state.answered[sc.id] = { correct: correct, pts: pts, at: Date.now(), bonus: inBonus };
    if (!inBonus && state.todayIds.indexOf(sc.id) === -1) state.todayIds.push(sc.id);
    if (!inBonus){
      state.score += pts;
      if (correct){ state.correct++; state.streak++; if (state.streak > (state.bestStreak || 0)) state.bestStreak = state.streak; }
      else { state.wrong++; state.streak = 0; }
    }
    state.phase = 'flashcard';
    state.fcIndex = 0;
    state.lastPick = index;
    save(); render();
    const el = document.querySelector('.fc-wrap');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function advanceFlashcard(){
    const sc = SCENARIOS.find(s => s.id === state.current);
    if (!sc) { goNext(); return; }
    const rec = state.answered[sc.id];
    const cards = buildFlashcards(sc, rec && rec.correct);
    if (state.fcIndex < cards.length - 1){
      state.fcIndex++;
      save(); render();
      window.scrollTo({ top:0, behavior:'smooth' });
    } else {
      goNext();
    }
  }

  function exitFlashcards(){
    if (confirm('Stop this session? Your progress so far is saved.')){
      window.location.href = 'hub.html';
    }
  }

  function goNext(){
    state.phase = 'question';
    state.current = null;
    state.lastPick = null;
    state.shuffle = null;
    state.fcIndex = 0;
    save(); render();
    const el = document.querySelector('.msg-wrap') || document.querySelector('.comeback') || document.querySelector('.complete');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    else window.scrollTo({ top:0, behavior:'smooth' });
  }

  function resetAll(){
    if (!window.confirm('Reset all progress? Your score, streak and answered scenarios will be cleared.')) return;
    state = { score:0, correct:0, wrong:0, streak:0, bestStreak:0, dayStreak:0, day:null, todayIds:[], answered:{}, current:null, phase:'question', lastPick:null, bonus:false, shuffle:null, fcIndex:0 };
    save(); render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.addEventListener('click', function(e){
    const choice = e.target.closest('[data-choice]');
    if (choice){ answer(parseInt(choice.getAttribute('data-choice'), 10)); return; }

    const nextFcBtn = e.target.closest('[data-action="next-flashcard"]');
    if (nextFcBtn){ advanceFlashcard(); return; }

    const skipFcBtn = e.target.closest('[data-action="skip-flashcards"]');
    if (skipFcBtn){ goNext(); return; }

    const exitFcBtn = e.target.closest('[data-action="exit-flashcards"]');
    if (exitFcBtn){ exitFlashcards(); return; }

    const keepBtn = e.target.closest('[data-action="keep-practising"]');
    if (keepBtn){
      if (allDone()) return;
      state.bonus = true; state.phase = 'question'; state.current = null; state.lastPick = null; state.shuffle = null; state.fcIndex = 0;
      save(); render();
      const el = document.querySelector('.msg-wrap');
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    const nextBtn = e.target.closest('[data-action="next"]');
    if (nextBtn){ goNext(); return; }
    const resetBtn = e.target.closest('[data-action="reset"]');
    if (resetBtn){ resetAll(); return; }
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (state.phase === 'question'){
      if (e.key === '1' || e.key === '2'){
        e.preventDefault();
        const displayIdx = parseInt(e.key, 10) - 1;
        const order = state.shuffle || [0, 1];
        answer(order[displayIdx]);
      }
    } else if (state.phase === 'flashcard'){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); advanceFlashcard(); }
      if (e.key === 'Escape'){ e.preventDefault(); exitFlashcards(); }
    }
  });

  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle){
    themeToggle.addEventListener('click', function(){
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('cyberwise.theme', next); } catch (e) {}
    });
  }

  const topbar = document.getElementById('topbar');
  function onScroll(){ if (!topbar) return; topbar.classList.toggle('scrolled', window.scrollY > 12); }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  render();
})();
</script>
<script src="cursor.js" defer></script>
</body>
</html>
