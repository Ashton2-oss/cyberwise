<!-- FILE: recovery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<script>
(function(){
  try {
    var t = localStorage.getItem('cyberwise.theme');
    if (!t) t = 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<title>CyberWise — I clicked something</title>
<meta name="description" content="The first ten minutes matter. A step-by-step recovery plan for whatever just happened."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F141B"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
svg{display:block;max-width:32px;max-height:32px;flex-shrink:0}
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface-2:#FAFAFE;
  --border:rgba(20,20,43,.08);--border-strong:rgba(20,20,43,.14);
  --ink:#1A1A2E;--ink-2:#4B4B6B;--ink-3:#8B8BA7;--ink-4:#B8B8CE;
  --lime:#C7F548;--lime-hover:#B8E63A;--lime-glow:rgba(199,245,72,.4);
  --lavender:#A78BFA;--lavender-2:#8B5CF6;--lavender-soft:rgba(167,139,250,.12);
  --sky:#60A5FA;--sky-soft:rgba(96,165,250,.12);
  --mint:#10B981;--mint-2:#34D399;--mint-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;--amber-2:#FBBF24;--amber-soft:rgba(245,158,11,.12);
  --rose:#EF4444;--rose-2:#F87171;--rose-soft:rgba(239,68,68,.12);
  --c-accent:#8B5CF6;--grid-color:rgba(20,20,43,.03);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0F141B;
  --surface:#171D29;
  --surface-2:#1F2735;
  --ink:#F3EBDD;
  --ink-2:#C6B9A7;
  --ink-3:#8A7F6D;
  --ink-4:#5D534C;
  --border:rgba(243,235,221,.08);
  --border-strong:rgba(243,235,221,.12);
  --lime:#C6D97A;
  --lime-hover:#D2E28D;
  --lime-glow:rgba(198,217,122,.12);
  --lavender:#A6B5D8;
  --lavender-2:#93A6D6;
  --lavender-soft:rgba(166,181,216,.12);
  --sky:#8BC7D8;
  --sky-soft:rgba(139,199,216,.12);
  --mint:#87C6A3;
  --mint-2:#A5D6B4;
  --mint-soft:rgba(135,198,163,.12);
  --amber:#D4A060;
  --amber-2:#E0AF6D;
  --amber-soft:rgba(212,160,96,.12);
  --rose:#D58989;
  --rose-2:#E0A0A0;
  --rose-soft:rgba(213,137,137,.12);
  --c-accent:#D4A060;
  --grid-color:rgba(243,235,221,.025);
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100%;transition:background .4s var(--ease),color .4s var(--ease);
}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-scene::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(239,68,68,.14), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(245,158,11,.1), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.1), transparent 60%),
    var(--bg);
}
[data-theme="dark"] .bg-scene::before{
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(239,68,68,.1), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(245,158,11,.06), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.06), transparent 60%),
    var(--bg);
}
.grid-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-color) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
  -webkit-mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
}
.cursor-dot,.cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:10000;
  will-change:transform;
  transition:opacity .3s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
}
.cursor-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c-accent);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 8px rgba(139,92,246,.5);
}
.cursor-ring{
  width:26px;height:26px;border-radius:50%;
  border:1.25px solid var(--c-accent);opacity:.5;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 0 10px rgba(139,92,246,.25);
}
[data-theme="dark"] .cursor-dot{
  box-shadow:0 0 6px var(--c-accent),0 0 12px rgba(167,139,250,.4);
  mix-blend-mode:screen;
}
[data-theme="dark"] .cursor-ring{
  box-shadow:0 0 12px rgba(167,139,250,.3);mix-blend-mode:screen;
}
.cursor-ring.is-hover{opacity:.9;border-color:var(--lavender-2)}
.cursor-ring.is-cta{opacity:1;border-color:var(--lavender-2)}
@media (max-width:1024px){.cursor-dot,.cursor-ring{display:none!important}}
@media (hover:none){.cursor-dot,.cursor-ring{display:none!important}}

/* ───── TOPBAR ───── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Inter',sans-serif;color:var(--ink-3);
  transition:background .3s,backdrop-filter .3s,border-color .3s;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom-color:var(--border);
}
.topbar .brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);
  font-size:1rem;font-weight:700;letter-spacing:-.025em;text-decoration:none;
}
.brand-mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--lavender-2),var(--sky));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(139,92,246,.35);
}
.brand-mark svg{width:17px;height:17px;color:#fff}
.topbar .nav{display:flex;align-items:center;gap:4px}
.topbar .nav a{
  color:var(--ink-2);text-decoration:none;
  font-size:.86rem;font-weight:500;
  padding:8px 14px;border-radius:100px;
  transition:all .2s var(--ease);
}
.topbar .nav a:hover{color:var(--ink);background:rgba(139,92,246,.06)}
.topbar .nav a.active{color:var(--ink);background:var(--lavender-soft)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-2);
  transition:all .25s var(--ease);position:relative;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-strong);transform:translateY(-1px)}
.theme-toggle svg{width:16px;height:16px;position:absolute;transition:all .35s var(--ease)}
.theme-toggle .ti-sun{opacity:0;transform:rotate(-90deg) scale(.6)}
.theme-toggle .ti-moon{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-moon{opacity:0;transform:rotate(90deg) scale(.6)}
@media(max-width:1024px){.topbar{padding:14px 20px}.topbar .nav a{padding:6px 9px;font-size:.78rem}}
@media(max-width:820px){
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:10px 14px}
  .topbar .brand{grid-column:1;grid-row:1}
  .topbar .nav{grid-column:1 / -1;grid-row:2;display:none;gap:2px;min-width:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:0 0 auto;white-space:nowrap;padding:6px 9px;font-size:.76rem}
  .topbar .actions{grid-column:2;grid-row:1}
}

/* ───── PAGE ───── */
.page{
  position:relative;z-index:10;
  max-width:760px;margin:0 auto;
  padding:120px 32px 100px;
  animation:pageIn .6s var(--ease);
}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:100px 20px 80px}}

/* ───── HEADER ───── */
.header{margin-bottom:44px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--rose);background:var(--rose-soft);
  padding:7px 14px;border-radius:100px;margin-bottom:22px;
}
.eyebrow .dot{
  width:6px;height:6px;border-radius:50%;background:var(--rose);
  animation:eyebrowPulse 2s ease-in-out infinite;
}
@keyframes eyebrowPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}
  50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}
}
h1.title{
  font-size:clamp(2rem,4.4vw,3rem);
  font-weight:900;letter-spacing:-.04em;
  line-height:1.05;margin-bottom:20px;color:var(--ink);
}
h1.title em{
  font-style:normal;
  background:linear-gradient(120deg,#EF4444 0%,#F59E0B 50%,#8B5CF6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lede{
  font-size:1.08rem;color:var(--ink-2);
  line-height:1.7;max-width:600px;margin-bottom:16px;
}
.lede strong{color:var(--ink);font-weight:600}
.lede:last-child{margin-bottom:0}

/* ───── SCENARIO BANNER ───── */
.scenario-banner{
  display:flex;align-items:flex-start;gap:14px;
  padding:18px 20px;border-radius:16px;
  background:var(--lavender-soft);
  border:1px solid rgba(139,92,246,.22);
  margin-bottom:32px;
  animation:pageIn .5s var(--ease);
}
.scenario-banner[hidden]{display:none}
.scenario-banner-icon{
  width:38px;height:38px;border-radius:11px;
  background:rgba(139,92,246,.16);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.scenario-banner-icon svg{width:19px;height:19px}
.scenario-banner-text{flex:1;min-width:0;padding-top:2px}
.scenario-banner-title{
  font-family:'JetBrains Mono',monospace;
  font-size:.62rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lavender-2);
  margin-bottom:5px;
}
.scenario-banner-desc{
  font-size:.94rem;line-height:1.55;color:var(--ink);
}
.scenario-banner-desc strong{font-weight:700}
.scenario-banner-close{
  background:none;border:none;color:var(--ink-3);
  cursor:pointer;padding:6px;border-radius:8px;
  transition:all .2s var(--ease);flex-shrink:0;
}
.scenario-banner-close:hover{background:rgba(139,92,246,.12);color:var(--ink)}
.scenario-banner-close svg{width:14px;height:14px}

/* ───── TRIAGE ───── */
.triage-intro{
  font-size:.94rem;color:var(--ink-2);
  line-height:1.65;margin-bottom:18px;
}
.triage-intro strong{color:var(--ink);font-weight:600}
.triage-grid{
  display:flex;flex-direction:column;gap:10px;
  margin-bottom:40px;
}
.triage-card{
  display:flex;align-items:flex-start;gap:16px;
  padding:20px 22px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  transition:all .25s var(--ease);
  animation:stepIn .45s var(--ease) both;
  width:100%;
}
.triage-card:nth-child(1){animation-delay:.05s}
.triage-card:nth-child(2){animation-delay:.1s}
.triage-card:nth-child(3){animation-delay:.15s}
.triage-card:nth-child(4){animation-delay:.2s}
.triage-card:nth-child(5){animation-delay:.25s}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.triage-card:hover{
  border-color:var(--border-strong);
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(20,20,43,.07);
}
.triage-card:active{transform:translateY(0)}
.triage-card.urgent{border-color:rgba(239,68,68,.22)}
.triage-card.urgent:hover{border-color:rgba(239,68,68,.5);box-shadow:0 10px 28px rgba(239,68,68,.1)}
.triage-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--lavender-soft);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .25s var(--ease);
}
.triage-icon svg{width:22px;height:22px}
.triage-card.urgent .triage-icon{background:var(--rose-soft);color:var(--rose)}
.triage-text{flex:1;min-width:0;padding-top:1px}
.triage-label{
  font-size:1rem;font-weight:700;color:var(--ink);
  letter-spacing:-.012em;margin-bottom:4px;line-height:1.3;
}
.triage-desc{font-size:.88rem;color:var(--ink-3);line-height:1.5}
.triage-arrow{
  color:var(--ink-4);flex-shrink:0;align-self:center;
  transition:all .25s var(--ease);
}
.triage-arrow svg{width:16px;height:16px}
.triage-card:hover .triage-arrow{color:var(--lavender-2);transform:translateX(3px)}

/* ───── CHECKLIST ───── */
.checklist{margin-bottom:44px}
.checklist-head{margin-bottom:20px}
.checklist-head-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;margin-bottom:16px;
}
.checklist-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;
}
.checklist-sub{font-size:.98rem;color:var(--ink-2);line-height:1.45}
.checklist-sub strong{color:var(--ink);font-weight:700}
.checklist-change{
  background:none;border:1px solid var(--border);
  color:var(--ink-2);font-family:inherit;
  font-size:.82rem;font-weight:600;
  padding:7px 14px;border-radius:100px;
  cursor:pointer;transition:all .2s var(--ease);
  flex-shrink:0;white-space:nowrap;
}
.checklist-change:hover{
  border-color:var(--lavender-2);color:var(--lavender-2);
  background:var(--lavender-soft);
}
.checklist-progress{
  display:flex;align-items:center;gap:14px;
}
.checklist-bar{
  flex:1;height:6px;border-radius:100px;
  background:color-mix(in srgb,var(--ink-3) 15%,transparent);
  overflow:hidden;
}
.checklist-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--lavender-2),var(--mint));
  transition:width .55s var(--ease);
  box-shadow:0 0 10px rgba(139,92,246,.35);
  width:0%;
}
.checklist-count{
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:700;color:var(--ink-3);
  letter-spacing:.04em;white-space:nowrap;
}
.checklist-steps{display:flex;flex-direction:column;gap:12px}

/* ───── STEP ───── */
.step{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  transition:all .3s var(--ease);
  animation:stepIn .45s var(--ease) both;
}
.step:hover{border-color:var(--border-strong);box-shadow:0 6px 20px rgba(20,20,43,.05)}
.step.open{
  border-color:rgba(139,92,246,.35);
  box-shadow:0 10px 28px rgba(139,92,246,.09);
}
.step.done{border-color:rgba(16,185,129,.28)}
.step.urgent.open{
  border-color:rgba(239,68,68,.4);
  box-shadow:0 10px 28px rgba(239,68,68,.1);
}
.step-head{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  gap:16px;align-items:center;
  padding:18px 22px;
  cursor:pointer;user-select:none;
  transition:background .2s var(--ease);
}
.step-head:hover{background:var(--surface-2)}
.step-head:focus{outline:2px solid var(--lavender-2);outline-offset:-2px}
.step-num{
  width:40px;height:40px;border-radius:11px;
  background:var(--lavender-soft);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.94rem;font-weight:800;
  flex-shrink:0;transition:all .3s var(--ease);
}
.step.open .step-num{
  background:linear-gradient(135deg,var(--lavender-2),var(--sky));
  color:#fff;box-shadow:0 6px 18px rgba(139,92,246,.28);
}
.step.urgent .step-num{background:var(--rose-soft);color:var(--rose)}
.step.urgent.open .step-num{
  background:linear-gradient(135deg,var(--rose),#F59E0B);
  color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.28);
}
.step.done .step-num{
  background:linear-gradient(135deg,var(--mint),var(--mint-2));
  color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.28);
}
.step-title{
  font-size:1rem;font-weight:700;
  letter-spacing:-.014em;line-height:1.35;color:var(--ink);
  transition:color .25s var(--ease);
}
.step.done .step-title{color:var(--ink-3)}
.step-check{
  width:26px;height:26px;border-radius:8px;
  border:1.75px solid var(--border-strong);
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;flex-shrink:0;
  transition:all .22s var(--ease);
}
.step-check svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .2s var(--ease)}
.step-check:hover{border-color:var(--mint);background:var(--mint-soft)}
.step.done .step-check{
  background:var(--mint);border-color:var(--mint);
  box-shadow:0 4px 12px rgba(16,185,129,.3);
}
.step.done .step-check svg{opacity:1}
.step-chev{
  width:20px;height:20px;color:var(--ink-3);
  transition:transform .3s var(--ease),color .25s var(--ease);
  flex-shrink:0;
}
.step.open .step-chev{transform:rotate(180deg);color:var(--lavender-2)}
.step-panel{
  max-height:0;overflow:hidden;
  transition:max-height .5s var(--ease);
}
.step.open .step-panel{max-height:1400px}
.step-body{
  padding:0 22px 22px 78px;
  font-size:.95rem;line-height:1.7;color:var(--ink-2);
}
.step-body strong{color:var(--ink);font-weight:600}
.step-body em{font-style:normal;color:var(--lavender-2);font-weight:600}
.step-body p + p{margin-top:12px}
.step-body ul{
  list-style:none;display:flex;flex-direction:column;
  gap:9px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--border);
}
.step-body ul li{
  padding-left:24px;position:relative;
  font-size:.9rem;line-height:1.6;
}
.step-body ul li::before{
  content:'✓';position:absolute;left:0;top:0;
  color:var(--mint);font-weight:700;font-size:.92rem;
}
.step-meta{
  display:flex;align-items:center;gap:8px;
  margin-top:18px;padding-top:14px;
  border-top:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:600;
  letter-spacing:.06em;color:var(--ink-3);
  text-transform:uppercase;
}
.step-meta svg{width:12px;height:12px}
.step-body .crosslink{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:11px;
  background:var(--surface-2);
  border:1px solid var(--border);
  text-decoration:none;color:inherit;
  margin-top:16px;
  transition:all .22s var(--ease);
}
.step-body .crosslink:hover{
  border-color:var(--lavender-2);
  background:var(--lavender-soft);
  transform:translateX(2px);
}
.step-body .crosslink-icon{
  width:32px;height:32px;border-radius:9px;
  background:var(--lavender-soft);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.step-body .crosslink-icon svg{width:15px;height:15px}
.step-body .crosslink-text{flex:1;min-width:0}
.step-body .crosslink-label{
  font-family:'JetBrains Mono',monospace;

.step-body .crosslink-title{
  font-size:.86rem;font-weight:700;
  color:var(--ink);letter-spacing:-.008em;
  line-height:1.3;

  color:var(--ink-4);flex-shrink:0;

}
.step-body .crosslink-arrow svg{width:13px;height:13px}

/* ───── COMPLETE BANNER ───── */
.checklist-complete{
  margin-top:20px;padding:24px 26px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(52,211,153,.05));
  border:1px solid rgba(16,185,129,.3);
  display:flex;align-items:flex-start;gap:16px;
  animation:stepIn .5s var(--ease);
}
.checklist-complete[hidden]{display:none}
.cc-icon{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,var(--mint),var(--mint-2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 8px 22px rgba(16,185,129,.3);
}
.cc-icon svg{width:22px;height:22px}
.cc-text{flex:1;min-width:0}
.cc-title{
  font-size:1.08rem;font-weight:800;
  letter-spacing:-.02em;color:var(--ink);
  margin-bottom:6px;
}
.cc-sub{
  font-size:.9rem;color:var(--ink-2);
  line-height:1.6;margin-bottom:16px;
}
.cc-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ───── BUTTONS ───── */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 22px;border-radius:100px;
  font-family:inherit;font-size:.92rem;font-weight:600;
  border:none;cursor:pointer;text-decoration:none;
  transition:all .25s var(--ease);justify-content:center;
}
.btn svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.btn-primary{
  background:var(--lime);color:var(--ink);
  box-shadow:0 6px 20px var(--lime-glow);font-weight:700;
}
.btn-primary:hover{
  background:var(--lime-hover);transform:translateY(-2px);
  box-shadow:0 12px 30px var(--lime-glow);
}
.btn-primary:hover svg{transform:translateX(4px)}
[data-theme="dark"] .btn-primary{
  background:#87965F;color:#121217;
  box-shadow:0 4px 12px rgba(135,150,95,.16);
}
[data-theme="dark"] .btn-primary:hover{
  background:#96A66B;
  box-shadow:0 8px 18px rgba(135,150,95,.2);
}
.btn-secondary{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:var(--border-strong);transform:translateY(-2px);
}

/* ───── CONTACTS ───── */
.contact{
  padding:28px 28px 24px;border-radius:20px;
  background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(96,165,250,.04) 100%);
  border:1px solid rgba(139,92,246,.18);margin-bottom:36px;
}
.contact-label{
  font-size:.7rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lavender-2);margin-bottom:16px;
}
.contact-list{display:flex;flex-direction:column;gap:10px}
.contact-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:16px 18px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  text-decoration:none;color:inherit;
  transition:all .25s var(--ease);
}
a.contact-item:hover{
  border-color:var(--border-strong);transform:translateX(3px);
  box-shadow:0 8px 22px rgba(20,20,43,.06);
}
.contact-item.static{cursor:default}
.contact-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--lavender-soft);color:var(--lavender-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.contact-icon svg{width:20px;height:20px}
.contact-item.urgent .contact-icon{background:var(--rose-soft);color:var(--rose)}
.contact-text{flex:1;min-width:0;padding-top:1px}
.contact-title{
  font-size:.95rem;font-weight:700;color:var(--ink);
  margin-bottom:4px;letter-spacing:-.005em;line-height:1.3;
}
.contact-desc{font-size:.84rem;line-height:1.55;color:var(--ink-3)}
.contact-arrow{
  color:var(--ink-3);flex-shrink:0;
  transition:all .25s var(--ease);align-self:center;
}
.contact-arrow svg{width:15px;height:15px}
a.contact-item:hover .contact-arrow{color:var(--lavender-2);transform:translateX(3px)}

/* ───── CLOSING ───── */
.closing{
  text-align:center;padding:32px 28px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  margin-bottom:36px;
}
.closing-text{
  font-size:1.05rem;line-height:1.7;color:var(--ink);
  font-weight:500;max-width:540px;margin:0 auto;
  letter-spacing:-.005em;
}
.closing-text strong{color:var(--lavender-2);font-weight:700}

/* ───── FOOTER ───── */
.footer{
  margin-top:56px;padding-top:28px;
  border-top:1px solid var(--border);
  text-align:center;font-size:.82rem;
  color:var(--ink-3);line-height:1.7;
}
.footer-links{
  display:flex;justify-content:center;gap:18px;
  flex-wrap:wrap;margin-bottom:14px;
}
.footer a{color:var(--ink-3);text-decoration:none;transition:color .2s var(--ease)}
.footer a:hover{color:var(--ink)}
.footer-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;letter-spacing:.02em;color:var(--ink-4);
}
.footer-reset{
  background:none;border:none;font-family:inherit;
  font-size:.82rem;color:var(--ink-3);cursor:pointer;
  padding:4px 8px;border-radius:6px;
  transition:all .2s var(--ease);
}
.footer-reset:hover{color:var(--rose);background:var(--rose-soft)}

  // ═══════════════ STATE ═══════════════
  const STORE_KEY = 'cyberwise.recovery.v1';
  let state = loadState();

  function loadState(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { raw = null; }
    const s = Object.assign({
      triage: null,
      done: {},
      open: null,
      scenario: null,
      startedAt: null
    }, raw && typeof raw === 'object' ? raw : {});
    if (!s.done || typeof s.done !== 'object') s.done = {};
    if (s.triage && !TRIAGE[s.triage]) s.triage = null;
    return s;
  }

  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ═══════════════ URL PARAM ═══════════════
  (function readUrl(){
    try {
      const params = new URLSearchParams(window.location.search);
      const sc = params.get('scenario');
      if (sc && SCENARIO_NAMES[sc]){
        state.scenario = sc;
        save();
        const clean = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', clean);
      }
    } catch (e) {}
  })();

  // ═══════════════ HELPERS ═══════════════
  function getTriage(){
    return state.triage ? TRIAGE[state.triage] : null;
  }
  function getStepIds(){
    const t = getTriage();
    return t ? t.steps.slice() : [];
  }
  function getDoneCount(){
    return getStepIds().filter(id => state.done[id]).length;
  }
  function getTotalCount(){
    return getStepIds().length;
  }
  function allDone(){
    const total = getTotalCount();
    return total > 0 && getDoneCount() === total;
  }

  // ═══════════════ RENDER — HEADER ═══════════════
  function headerHTML(){
    return '' +
    '<header class="header">' +
      '<div class="eyebrow"><span class="dot"></span>Recovery \u00b7 Do this now</div>' +
      '<h1 class="title">I clicked something. <em>What now?</em></h1>' +
      '<p class="lede">You clicked a link. You entered a password. You downloaded a file. Maybe all three. <strong>Whatever it was \u2014 you\'re not the first person this has happened to, and you won\'t be the last.</strong></p>' +
      '<p class="lede">The first ten minutes matter. Not the first ten hours, not the next day. Pick what happened below and we\'ll walk you through it in order.</p>' +
    '</header>';
  }

  // ═══════════════ RENDER — SCENARIO BANNER ═══════════════
  function scenarioBannerHTML(){
    if (!state.scenario) return '';
    const name = SCENARIO_NAMES[state.scenario] || 'a phishing message';
    return '' +
    '<div class="scenario-banner" id="scenarioBanner">' +
      '<div class="scenario-banner-icon">' + ic('bolt', 2.2) + '</div>' +
      '<div class="scenario-banner-text">' +
        '<div class="scenario-banner-title">You just got caught by</div>' +
        '<div class="scenario-banner-desc">' + name.charAt(0).toUpperCase() + name.slice(1) + '. Here\'s what to do next.</div>' +
      '</div>' +
      '<button type="button" class="scenario-banner-close" data-action="dismiss-scenario" aria-label="Dismiss">' + ic('x', 2.4) + '</button>' +
    '</div>';
  }

  // ═══════════════ RENDER — TRIAGE ═══════════════
  function triageHTML(){
    const cards = TRIAGE_ORDER.map(function(id){
      const t = TRIAGE[id];
      return '' +
      '<button type="button" class="triage-card' + (t.urgent ? ' urgent' : '') + '" data-triage="' + id + '">' +
        '<div class="triage-icon">' + ic(t.icon, 2.2) + '</div>' +
        '<div class="triage-text">' +
          '<div class="triage-label">' + t.label + '</div>' +
          '<div class="triage-desc">' + t.desc + '</div>' +
        '</div>' +
        '<span class="triage-arrow">' + ic('arrow', 2.4) + '</span>' +
      '</button>';
    }).join('');

    return '' +
    '<section class="triage">' +
      '<p class="triage-intro">If you <strong>sent money or shared an OTP</strong>, call your bank before anything else on this page. Otherwise, start with the closest match below.</p>' +
      '<div class="triage-grid">' + cards + '</div>' +
    '</section>';
  }

  // ═══════════════ RENDER — STEP ═══════════════
  function stepHTML(id, index){
    const s = STEPS[id];
    if (!s) return '';
    const done = !!state.done[id];
    const open = state.open === id;
    const num = String(index + 1).padStart(2, '0');

    // Cross-link to guide
    let crosslinkHTML = '';
    if (s.guideSection){
      crosslinkHTML =
        '<a class="crosslink" href="guide.html#sec-' + s.guideSection + '">' +
          '<div class="crosslink-icon">' + ic('book', 2.2) + '</div>' +
          '<div class="crosslink-text">' +
            '<div class="crosslink-label">Read more · Section ' + s.guideSection + '</div>' +
            '<div class="crosslink-title">' + (GUIDE_TITLES[s.guideSection] || '') + '</div>' +
          '</div>' +
          '<span class="crosslink-arrow">' + ic('arrow', 2.4) + '</span>' +
        '</a>';
    }

    return '' +
    '<div class="step' + (open ? ' open' : '') + (done ? ' done' : '') + (s.urgent ? ' urgent' : '') + '" data-step="' + id + '">' +
      '<div class="step-head" data-toggle="' + id + '" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<div class="step-num">' + num + '</div>' +
        '<div class="step-title">' + s.title + '</div>' +
        '<button type="button" class="step-check" data-check="' + id + '" aria-label="Mark step complete" aria-pressed="' + (done ? 'true' : 'false') + '">' + ic('check', 3) + '</button>' +
        '<svg class="step-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + ICONS.chev + '</svg>' +
      '</div>' +
      '<div class="step-panel">' +
        '<div class="step-body">' +
          s.body +
          crosslinkHTML +
          '<div class="step-meta">' + ic('clock', 2) + '<span>' + s.time + '</span></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ═══════════════ RENDER — CHECKLIST ═══════════════
  function checklistHTML(){
    const t = getTriage();
    if (!t) return '';

    const ids = t.steps;
    const total = ids.length;
    const done = getDoneCount();
    const pct = total ? Math.round(done / total * 100) : 0;
    const complete = done === total;

    const stepsHTML = ids.map(function(id, i){ return stepHTML(id, i); }).join('');

    return '' +
    '<section class="checklist">' +
      '<div class="checklist-head">' +
        '<div class="checklist-head-top">' +
          '<div>' +
            '<div class="checklist-label">Your recovery plan</div>' +
            '<div class="checklist-sub">Based on: <strong>' + t.label + '</strong></div>' +
          '</div>' +
          '<button type="button" class="checklist-change" data-action="change">Change</button>' +
        '</div>' +
        '<div class="checklist-progress">' +
          '<div class="checklist-bar"><div class="checklist-fill" id="checklistFill" style="width:' + pct + '%"></div></div>' +
          '<div class="checklist-count" id="checklistCount">' + done + ' of ' + total + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="checklist-steps" id="checklistSteps">' + stepsHTML + '</div>' +

      '<div class="checklist-complete" id="checklistComplete"' + (complete ? '' : ' hidden') + '>' +
        '<div class="cc-icon">' + ic('check', 3) + '</div>' +
        '<div class="cc-text">' +
          '<div class="cc-title">All steps done.</div>' +
          '<div class="cc-sub">You\'ve handled the first ten minutes. Keep an eye on your accounts over the next few weeks \u2014 if anything unfamiliar shows up, go straight back to step 2.</div>' +
          '<div class="cc-actions">' +
            '<a class="btn btn-primary" href="screen6.html">Practise in Spot the Phish ' + ic('arrow', 2) + '</a>' +
            '<a class="btn btn-secondary" href="guide.html">Read the guide</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  // ═══════════════ RENDER — CONTACTS ═══════════════
  function contactsHTML(){
    const t = getTriage();
    if (!t) return '';
    const ids = t.contacts || [];
    if (!ids.length) return '';

    const items = ids.map(function(id){
      const c = CONTACTS[id];
      if (!c) return '';
      const inner =
        '<div class="contact-icon">' + ic(c.icon, 2.2) + '</div>' +
        '<div class="contact-text">' +
          '<div class="contact-title">' + c.title + '</div>' +
          '<div class="contact-desc">' + c.desc + '</div>' +
        '</div>' +
        (c.href ? '<span class="contact-arrow">' + ic('arrow', 2.4) + '</span>' : '');

      if (c.href) {
        return '<a class="contact-item' + (c.urgent ? ' urgent' : '') + '" href="' + c.href + '"' +
          (c.href.charAt(0) === 'h' ? ' target="_blank" rel="noopener"' : '') + '>' + inner + '</a>';
      }
      return '<div class="contact-item static' + (c.urgent ? ' urgent' : '') + '">' + inner + '</div>';
    }).join('');

    return '' +
    '<section class="contact">' +
      '<div class="contact-label">Who to contact</div>' +
      '<div class="contact-list">' + items + '</div>' +
    '</section>';
  }

  // ═══════════════ RENDER — CLOSING + FOOTER ═══════════════
  function closingHTML(){
    return '' +
    '<div class="closing">' +
      '<div class="closing-text">You are not the first person this has happened to. You will not be the last. <strong>The only wrong response is silence.</strong></div>' +
    '</div>';
  }

  function footerHTML(){
    return '' +
    '<footer class="footer">' +
      '<div class="footer-links">' +
        '<a href="landing.html">Home</a>' +
        '<a href="guide.html">Guide</a>' +
        '<a href="screen6.html">Practise</a>' +
        '<a href="daily.html">Daily</a>' +
        '<a href="data_breach.html">Breach Lab</a>' +
      '</div>' +
      '<div class="footer-meta">CyberWise · Recovery · No accounts · No tracking</div>' +
      (state.triage || Object.keys(state.done).length
        ? '<div style="margin-top:10px"><button type="button" class="footer-reset" data-action="reset">Reset recovery progress</button></div>'
        : '') +
    '</footer>';
  }

  // ═══════════════ MAIN RENDER ═══════════════
  function render(){
    const app = document.getElementById('app');
    let body = headerHTML();
    body += scenarioBannerHTML();
    body += state.triage ? checklistHTML() : triageHTML();
    body += contactsHTML();
    body += closingHTML();
    body += footerHTML();
    app.innerHTML = body;
  }

  // ═══════════════ ACTIONS ═══════════════
  function selectTriage(id){
    if (!TRIAGE[id]) return;
    state.triage = id;
    state.startedAt = state.startedAt || Date.now();
    const first = TRIAGE[id].steps[0];
    state.open = first;
    save();
    render();
    const el = document.querySelector('.checklist');
    if (el){
      const top = el.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }
  }

  function toggleCheck(id){
    if (!STEPS[id]) return;
    state.done[id] = !state.done[id];
    if (!state.done[id]) delete state.done[id];
    save();

    const el = document.querySelector('[data-step="' + id + '"]');
    if (el){
      el.classList.toggle('done', !!state.done[id]);
      const btn = el.querySelector('[data-check]');
      if (btn) btn.setAttribute('aria-pressed', state.done[id] ? 'true' : 'false');
    }
    updateProgress();
  }

  function toggleOpen(id){
    if (!STEPS[id]) return;
    state.open = state.open === id ? null : id;
    save();

    document.querySelectorAll('.step').forEach(function(el){
      const isOpen = el.getAttribute('data-step') === state.open;
      el.classList.toggle('open', isOpen);
      const head = el.querySelector('[data-toggle]');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

  function updateProgress(){
    const total = getTotalCount();
    const done = getDoneCount();
    const pct = total ? Math.round(done / total * 100) : 0;

    const fill = document.getElementById('checklistFill');
    const count = document.getElementById('checklistCount');
    const complete = document.getElementById('checklistComplete');

    if (fill) fill.style.width = pct + '%';
    if (count) count.textContent = done + ' of ' + total;
    if (complete) {
      if (done === total && total > 0) complete.removeAttribute('hidden');
      else complete.setAttribute('hidden', '');
    }
  }

  function changeTriage(){
    state.triage = null;
    state.open = null;
    save();
    render();
    const el = document.querySelector('.triage');
    if (el){
      const top = el.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }
  }

  function dismissScenario(){
    state.scenario = null;
    save();
    const el = document.getElementById('scenarioBanner');
    if (el){
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-6px)';
      setTimeout(function(){ el.remove(); }, 300);
    }
  }

  function resetAll(){
    if (!window.confirm('Reset recovery progress? Your checklist and triage selection will be cleared.')) return;
    state = {
      triage: null,
      done: {},
      open: null,
      scenario: null,
      startedAt: null
    };
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ═══════════════ EVENT DELEGATION ═══════════════
  document.addEventListener('click', function(e){
    const check = e.target.closest('[data-check]');
    if (check) {
      e.stopPropagation();
      toggleCheck(check.getAttribute('data-check'));
      return;
    }

    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      toggleOpen(toggle.getAttribute('data-toggle'));
      return;
    }

    const triage = e.target.closest('[data-triage]');
    if (triage) {
      selectTriage(triage.getAttribute('data-triage'));
      return;
    }

    const action = e.target.closest('[data-action]');
    if (action) {
      const a = action.getAttribute('data-action');
      if (a === 'change')           { changeTriage();   return; }
      if (a === 'reset')            { resetAll();       return; }
      if (a === 'dismiss-scenario') { dismissScenario(); return; }
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const toggle = e.target.closest('[data-toggle]');
    if (toggle && e.target === toggle) {
      e.preventDefault();
      toggleOpen(toggle.getAttribute('data-toggle'));
    }
  });

  // ═══════════════ THEME TOGGLE ═══════════════
  (function theme(){
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    btn.addEventListener('click', function(){
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('cyberwise.theme', next); } catch (e) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', next === 'dark' ? '#0B0A17' : '#F5F4FB');
    });
  })();

  // ═══════════════ TOPBAR SCROLL ═══════════════
  (function topbar(){
    const el = document.getElementById('topbar');
    if (!el) return;
    function update(){ el.classList.toggle('scrolled', window.scrollY > 12); }
    window.addEventListener('scroll', update, { passive:true });
    update();
  })();

  // ═══════════════ CUSTOM CURSOR ═══════════════
  (function cursor(){
    const canRun = window.matchMedia('(hover: hover) and (pointer: fine)').matches && window.innerWidth > 1024;
    if (!canRun) return;
    const dot  = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    if (!dot || !ring) return;

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;
    let scale = 1, targetScale = 1;

    window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, { passive:true });

    document.addEventListener('mouseover', function(e){
      const t = e.target.closest('a, button, [role="button"], .triage-card, .step-head, .contact-item, .crosslink');
      if (t){
        targetScale = 1.15;
        ring.classList.add('is-hover');
        if (t.classList.contains('btn-primary') || t.classList.contains('triage-card') || t.classList.contains('crosslink')) {
          ring.classList.add('is-cta');
        }
      }
    });

    document.addEventListener('mouseout', function(e){
      const t = e.target.closest('a, button, [role="button"], .triage-card, .step-head, .contact-item, .crosslink');
      if (t){
        targetScale = 1;
        ring.classList.remove('is-hover', 'is-cta');
      }
    });

    (function tick(){
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      scale += (targetScale - scale) * 0.22;
      dot.style.transform  = 'translate3d(' + (mx - 3) + 'px,' + (my - 3) + 'px,0)';
      ring.style.transform = 'translate3d(' + (rx - 13) + 'px,' + (ry - 13) + 'px,0) scale(' + scale + ')';
      requestAnimationFrame(tick);
    })();
  })();

  // ═══════════════ BOOT ═══════════════
  render();
})();
</script>
<script src="register-sw.js"></script>
<script src="navigation.js"></script>
</body>
