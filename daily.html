<title>CyberWise — Daily Phish</title>
<meta name="description" content="One scenario a day, same for everyone. Build the habit of spotting a scam in ten seconds."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0F141B"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
svg{display:block;max-width:32px;max-height:32px;flex-shrink:0}
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface-2:#FAFAFE;
  --border:rgba(20,20,43,.08);--border-strong:rgba(20,20,43,.14);
  --ink:#1A1A2E;--ink-2:#4B4B6B;--ink-3:#8B8BA7;--ink-4:#B8B8CE;
  --lime:#C7F548;--lime-hover:#B8E63A;--lime-glow:rgba(199,245,72,.4);
  --lavender:#A78BFA;--lavender-2:#8B5CF6;--lavender-soft:rgba(167,139,250,.12);
  --sky:#60A5FA;--sky-soft:rgba(96,165,250,.12);
  --mint:#10B981;--mint-2:#34D399;--mint-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;--amber-2:#FBBF24;--amber-soft:rgba(245,158,11,.12);
  --rose:#EF4444;--rose-2:#F87171;--rose-soft:rgba(239,68,68,.12);
  --c-accent:#8B5CF6;--grid-color:rgba(20,20,43,.03);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0F141B;
  --surface:#171D29;
  --surface-2:#1F2735;
  --ink:#F3EBDD;
  --ink-2:#C6B9A7;
  --ink-3:#8A7F6D;
  --ink-4:#5D534C;
  --border:rgba(243,235,221,.08);
  --border-strong:rgba(243,235,221,.12);
  --lime:#C6D97A;
  --lime-hover:#D2E28D;
  --lime-glow:rgba(198,217,122,.12);
  --lavender:#A6B5D8;
  --lavender-2:#93A6D6;
  --lavender-soft:rgba(166,181,216,.12);
  --sky:#8BC7D8;
  --sky-soft:rgba(139,199,216,.12);
  --mint:#87C6A3;
  --mint-2:#A5D6B4;
  --mint-soft:rgba(135,198,163,.12);
  --amber:#D4A060;
  --amber-2:#E0AF6D;
  --amber-soft:rgba(212,160,96,.12);
  --rose:#D58989;
  --rose-2:#E0A0A0;
  --rose-soft:rgba(213,137,137,.12);
  --c-accent:#D4A060;
  --grid-color:rgba(243,235,221,.025);
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100%;transition:background .4s var(--ease),color .4s var(--ease);
}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-scene::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(199,245,72,.14), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.12), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.1), transparent 60%),
    var(--bg);
}
[data-theme="dark"] .bg-scene::before{
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(199,245,72,.08), transparent 60%),
    radial-gradient(ellipse 800px 500px at 90% 10%, rgba(96,165,250,.08), transparent 65%),
    radial-gradient(ellipse 700px 500px at 50% 110%, rgba(139,92,246,.07), transparent 60%),
    var(--bg);
}
.grid-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-color) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
  -webkit-mask-image:radial-gradient(circle 1100px at 50% 30%,#000,transparent 85%);
}
.cursor-dot,.cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:10000;
  will-change:transform;
  transition:opacity .3s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
}
.cursor-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c-accent);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 8px rgba(139,92,246,.5);
}
.cursor-ring{
  width:26px;height:26px;border-radius:50%;
  border:1.25px solid var(--c-accent);opacity:.5;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 0 10px rgba(139,92,246,.25);
}
[data-theme="dark"] .cursor-dot{
  box-shadow:0 0 6px var(--c-accent),0 0 12px rgba(167,139,250,.4);
  mix-blend-mode:screen;
}
[data-theme="dark"] .cursor-ring{
  box-shadow:0 0 12px rgba(167,139,250,.3);mix-blend-mode:screen;
}
.cursor-ring.is-hover{opacity:.9;border-color:var(--lavender-2)}
.cursor-ring.is-cta{opacity:1;border-color:var(--lavender-2)}
@media (max-width:1024px){.cursor-dot,.cursor-ring{display:none!important}}
@media (hover:none){.cursor-dot,.cursor-ring{display:none!important}}

/* ───── TOPBAR ───── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Inter',sans-serif;color:var(--ink-3);
  transition:background .3s,backdrop-filter .3s,border-color .3s;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom-color:var(--border);
}
.topbar .brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);
  font-size:1rem;font-weight:700;letter-spacing:-.025em;text-decoration:none;
}
.brand-mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--lavender-2),var(--sky));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(139,92,246,.35);
}
.brand-mark svg{width:17px;height:17px;color:#fff}
.topbar .nav{display:flex;align-items:center;gap:4px}
.topbar .nav a{
  color:var(--ink-2);text-decoration:none;
  font-size:.86rem;font-weight:500;
  padding:8px 14px;border-radius:100px;
  transition:all .2s var(--ease);
}
.topbar .nav a:hover{color:var(--ink);background:rgba(139,92,246,.06)}
.topbar .nav a.active{color:var(--ink);background:var(--lavender-soft)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-2);
  transition:all .25s var(--ease);position:relative;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--border-strong);transform:translateY(-1px)}
.theme-toggle svg{width:16px;height:16px;position:absolute;transition:all .35s var(--ease)}
.theme-toggle .ti-sun{opacity:0;transform:rotate(-90deg) scale(.6)}
.theme-toggle .ti-moon{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="dark"] .theme-toggle .ti-moon{opacity:0;transform:rotate(90deg) scale(.6)}
@media(max-width:1024px){.topbar{padding:14px 20px}.topbar .nav a{padding:6px 9px;font-size:.78rem}}
@media(max-width:820px){
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:10px 14px}
  .topbar .brand{grid-column:1;grid-row:1}
  .topbar .nav{grid-column:1 / -1;grid-row:2;display:none;gap:2px;min-width:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:0 0 auto;white-space:nowrap;padding:6px 9px;font-size:.76rem}
  .topbar .actions{grid-column:2;grid-row:1}
}

/* ───── PAGE ───── */
.page{
  position:relative;z-index:10;
  max-width:680px;margin:0 auto;
  padding:120px 24px 80px;min-height:100vh;
  animation:pageIn .5s var(--ease);
}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:100px 18px 60px}}

/* ───── HEADER ───── */
.header{margin-bottom:28px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--lavender-2);
  background:var(--lavender-soft);
  padding:7px 14px;border-radius:100px;
  margin-bottom:20px;
}
.eyebrow .dot{
  width:6px;height:6px;border-radius:50%;background:var(--lavender-2);
  box-shadow:0 0 0 3px rgba(139,92,246,.15);
  animation:eyebrowPulse 2.4s ease-in-out infinite;
}
@keyframes eyebrowPulse{
  0%,100%{box-shadow:0 0 0 3px rgba(139,92,246,.15)}
  50%{box-shadow:0 0 0 6px rgba(139,92,246,.05)}
}
.title{
  font-size:clamp(1.8rem,4vw,2.4rem);
  font-weight:900;letter-spacing:-.035em;
  line-height:1.1;color:var(--ink);
  margin-bottom:12px;
}
.title em{
  font-style:normal;
  background:linear-gradient(120deg,#C7F548 0%,#34D399 50%,#60A5FA 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{
  font-size:1rem;line-height:1.65;
  color:var(--ink-2);max-width:520px;
}
.sub strong{color:var(--ink);font-weight:600}

/* ───── DATE + STREAK ───── */
.date-row{
  display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
  padding-top:22px;
  border-top:1px solid var(--border);
}
.date-pill{
  display:inline-flex;align-items:center;gap:9px;
  padding:10px 15px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:.78rem;font-weight:700;
  color:var(--ink-2);letter-spacing:-.005em;
}
.date-pill strong{color:var(--ink);font-weight:800}
.date-pill svg{width:14px;height:14px;color:var(--ink-3)}
.streak-pill{
  display:inline-flex;align-items:center;gap:9px;
  padding:10px 16px;border-radius:100px;
  background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.06));
  border:1px solid rgba(245,158,11,.3);
  font-family:'JetBrains Mono',monospace;
  font-size:.78rem;font-weight:800;
  color:var(--amber);letter-spacing:-.005em;
}
.streak-pill svg{width:14px;height:14px;color:var(--amber);flex-shrink:0}
.streak-pill strong{color:var(--ink);font-weight:800;font-size:.92rem}
.streak-pill.empty{
  background:var(--surface);
  border-color:var(--border);
  color:var(--ink-3);
}
.streak-pill.empty svg{color:var(--ink-4)}

/* ───── CALENDAR STRIP ───── */
.calendar{
  margin-top:26px;padding:18px 20px 20px;
  border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
}
.calendar-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.62rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
  margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.calendar-label .cal-count{
  color:var(--lavender-2);
  font-weight:800;
  letter-spacing:.04em;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(15,1fr);
  gap:4px;
}
@media(max-width:600px){.calendar-grid{grid-template-columns:repeat(10,1fr)}}
@media(max-width:400px){.calendar-grid{grid-template-columns:repeat(8,1fr)}}
.cal-day{
  aspect-ratio:1;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.62rem;font-weight:700;
  color:var(--ink-4);
  position:relative;
  transition:all .25s var(--ease);
}
.cal-day.today{
  border-color:var(--lavender-2);
  background:var(--lavender-soft);
  color:var(--lavender-2);
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
  font-weight:800;
}
.cal-day.correct{
  background:var(--mint-soft);
  border-color:rgba(16,185,129,.35);
  color:var(--mint);
}
.cal-day.wrong{
  background:var(--rose-soft);
  border-color:rgba(239,68,68,.3);
  color:var(--rose);
}
.cal-day.correct::after{
  content:'✓';
  position:absolute;
  font-size:.72rem;
  font-weight:800;
}

@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

}

  box-shadow:0 0 0 0 rgba(16,185,129,.5);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}

.today-meta{

}

.meta-chip[data-tone="diff-medium"]{color:var(--amber);background:var(--amber-soft)}
.meta-chip[data-tone="diff-hard"]{color:var(--rose);background:var(--rose-soft)}
.meta-chip[data-tone="channel"]{

}

/* ───── PHONE MOCKUP ───── */
.phone{
  width:100%;border-radius:22px;

}

}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}

}
.choice::before{
  content:attr(data-key);
  flex-shrink:0;width:24px;height:24px;border-radius:7px;
  background:color-mix(in srgb,var(--ink-3) 12%,transparent);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:700;color:var(--ink-3);
  transition:all .25s var(--ease);
}
.choice:hover{
  border-color:var(--border-strong);
  background:var(--surface-2);
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(20,20,43,.06);
}
.choice:hover::before{

}

}

}
.reveal-verdict.safe{color:var(--mint);background:var(--mint-soft)}
.reveal-verdict.unsafe{color:var(--rose);background:var(--rose-soft)}
.reveal-verdict .rd{width:8px;height:8px;border-radius:50%;background:currentColor}
.streak-update{

}

.streak-update[hidden]{display:none}
.reveal-title{

}

  font-size:.98rem;line-height:1.7;color:var(--ink-2);margin-bottom:28px;
}
.reveal-body strong{color:var(--ink);font-weight:600}
.block{
  margin-bottom:20px;padding:20px 22px;border-radius:16px;

}

}
.block-icon svg{width:15px;height:15px}
.block-label{

  font-size:.64rem;font-weight:700;letter-spacing:.14em;

}

.signal{display:flex;align-items:flex-start;gap:12px}
.signal-num{

  font-size:.7rem;font-weight:700;color:var(--amber);
  flex-shrink:0;width:20px;margin-top:2px;
}
.signal-text{flex:1;min-width:0}
.signal-name{
  font-size:.9rem;font-weight:700;color:var(--ink);
  margin-bottom:4px;letter-spacing:-.005em;
}
.signal-detail{font-size:.86rem;line-height:1.6;color:var(--ink-2)}
.block.stakes .block-icon{background:var(--rose-soft);color:var(--rose)}
.block.stakes p{font-size:.92rem;line-height:1.65;color:var(--ink-2)}
.block.verify .block-icon{background:var(--mint-soft);color:var(--mint)}
.block.verify p{font-size:.92rem;line-height:1.65;color:var(--ink-2)}

.lever-name{
  display:inline-flex;align-items:center;gap:8px;

  font-size:.66rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:6px 12px;border-radius:100px;
  background:var(--lavender-soft);color:var(--lavender-2);
  margin-bottom:12px;
}
.lever-name .ld{width:6px;height:6px;border-radius:50%;background:currentColor}
.lever-explain{font-size:.9rem;line-height:1.65;color:var(--ink-2)}

/* ───── SHARE ROW ───── */
.share-row{
  display:flex;gap:10px;flex-wrap:wrap;
  padding-top:22px;margin-top:22px;
  border-top:1px solid var(--border);
}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 22px;border-radius:100px;
  font-family:inherit;font-size:.92rem;font-weight:600;
  border:none;cursor:pointer;text-decoration:none;

  box-shadow:0 4px 12px rgba(135,150,95,.16);
}

  box-shadow:0 8px 18px rgba(135,150,95,.2);

}

}

.intro{
  margin-top:26px;padding:22px 24px;
  border-radius:18px;
  background:var(--surface);
  border:1px dashed var(--border-strong);
}

}
.intro-text{
  font-size:.9rem;line-height:1.6;
  color:var(--ink-2);
}
.intro-text strong{color:var(--ink);font-weight:600}

/* ───── FOOTER ───── */
.footer{
  margin-top:56px;padding-top:28px;
  border-top:1px solid var(--border);
  text-align:center;font-size:.82rem;
  color:var(--ink-3);line-height:1.7;
}

}
.footer a{color:var(--ink-3);text-decoration:none;transition:color .2s var(--ease)}

  font-size:.7rem;letter-spacing:.02em;

}

  }

}

  // ═══════════════ DATES ═══════════════
  function pad(n){ return String(n).padStart(2, '0'); }
  function dateKey(d){
    const x = d || new Date();
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }
  function yesterdayKey(){
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return dateKey(d);
  }
  function formatLong(d){
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }
  function dayOfYear(d){
    const start = new Date(d.getFullYear(), 0, 0);
    const diff = d - start;
    return Math.floor(diff / 86400000);
  }
  function todaysIndex(d){
    // Deterministic per calendar day, but stable across years by using an offset
    const x = d || new Date();
    return (dayOfYear(x) + x.getFullYear()) % SCENARIOS.length;
  }

  // ═══════════════ STATE ═══════════════
  const STORE_KEY = 'cyberwise.daily.v1';
  let state = loadState();

  function loadState(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { raw = null; }
    const s = Object.assign({
      history:{},       // date -> { id, correct, choice }
      streak:0,
      bestStreak:0,
      lastAnswered:null
    }, raw && typeof raw === 'object' ? raw : {});
    if (!s.history || typeof s.history !== 'object') s.history = {};

    // Reset streak if we missed more than one day
    if (s.lastAnswered && s.lastAnswered !== dateKey() && s.lastAnswered !== yesterdayKey()){
      s.streak = 0;
    }
    return s;
  }
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ═══════════════ HELPERS ═══════════════
  function todaysScenario(){
    return SCENARIOS[todaysIndex()];
  }
  function todaysEntry(){
    return state.history[dateKey()];
  }
  function isAnsweredToday(){
    return !!todaysEntry();
  }
  function correctCount(){
    return Object.keys(state.history).filter(function(k){
      return state.history[k] && state.history[k].correct;
    }).length;
  }

  function render(){
    const app = document.getElementById('app');
    const sc = todaysScenario();
    const answered = isAnsweredToday();
    const entry = todaysEntry();

    const headerHTML = '' +
      '<header class="header">' +
        '<div class="eyebrow"><span class="dot"></span>Daily Phish · Same scenario for everyone</div>' +
        '<h1 class="title">One scam a day. <em>Ten seconds to spot it.</em></h1>' +

        '<div class="date-row">' +
          '<span class="date-pill">' + ic('calendar', 2.4) + '<strong>' + formatLong(new Date()) + '</strong></span>' +
          streakPillHTML() +
        '</div>' +
      '</header>';

    const calendarHTML = renderCalendar();

    const todayHTML = answered
      ? renderReveal(sc, entry) + renderComeback()
      : renderScenario(sc);

    const yesterdayHTML = renderYesterday();

    const footerHTML =
      '<footer class="footer">' +
        '<div class="footer-links">' +
          '<a href="landing.html">Home</a>' +
          '<a href="guide.html">Guide</a>' +
          '<a href="screen6.html">Practise</a>' +
          '<a href="data_breach.html">Breach Lab</a>' +
          '<a href="recovery.html">Recovery</a>' +
        '</div>' +
        '<div class="footer-meta">CyberWise · Daily Phish · No accounts · No tracking</div>' +
      '</footer>';

    app.innerHTML = headerHTML + calendarHTML + todayHTML + yesterdayHTML + footerHTML;
  }

  function streakPillHTML(){
    const s = state.streak || 0;
    if (s === 0){
      return '<span class="streak-pill empty">' + ic('flame', 2.4) + 'No streak yet · start today</span>';
    }
    return '<span class="streak-pill">' + ic('flame', 2.4) + '<strong>' + s + '</strong> day' + (s === 1 ? '' : 's') + ' in a row</span>';
  }

  function renderCalendar(){
    // Show last 15 days ending today, so today is always the rightmost cell
    const days = [];
    const today = new Date();
    for (let i = 14; i >= 0; i--){
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d);
    }

    const cells = days.map(function(d){
      const key = dateKey(d);
      const entry = state.history[key];
      const isToday = key === dateKey();

      let cls = 'cal-day';
      if (isToday) cls += ' today';
      if (entry){
        cls += entry.correct ? ' correct' : ' wrong';
      }
      const num = d.getDate();
      return '<div class="' + cls + '" title="' + key + '"><span>' + num + '</span></div>';
    }).join('');

    const playedCount = Object.keys(state.history).length;

    return '' +
    '<div class="calendar">' +
      '<div class="calendar-label">' +
        '<span>Last 15 days</span>' +
        '<span class="cal-count">' + playedCount + ' answered · ' + correctCount() + ' correct</span>' +
      '</div>' +
      '<div class="calendar-grid">' + cells + '</div>' +
    '</div>';
  }

  function renderScenario(sc){
    const choices = sc.choices.map(function(c, i){
      return '<button type="button" class="choice" data-choice="' + i + '" data-key="' + (i + 1) + '">' + c.label + '</button>';
    }).join('');

    return '' +
    '<div class="today-card">' +
      '<div class="today-label">' +
        '<div class="today-label-text"><span class="pulse"></span>Today\'s scenario</div>' +
        '<div class="today-meta">' +
          '<span class="meta-chip" data-tone="channel">' + sc.channel + '</span>' +
          '<span class="meta-chip" data-tone="diff-' + sc.difficulty + '">' + sc.difficulty + '</span>' +
        '</div>' +
      '</div>' +

      phoneHTML(sc) +

      '<div class="choices">' + choices + '</div>' +
    '</div>';
  }

  function phoneHTML(sc){
    return '' +
    '<div class="phone">' +
      '<div class="phone-head">' +
        '<div class="phone-app">' +
          '<div class="phone-app-icon">' + appIconHTML(sc.channel) + '</div>' +
          '<div class="phone-app-name">' + appName(sc.channel) + '</div>' +
        '</div>' +
        '<div class="phone-time">' + (sc.time || '') + '</div>' +
      '</div>' +
      '<div class="phone-sender">' +
        '<div class="phone-sender-name">' + sc.sender + '</div>' +
        (sc.senderLabel ? '<span class="phone-sender-tag">' + sc.senderLabel + '</span>' : '') +
      '</div>' +
      '<p class="phone-msg">' + sc.message + '</p>' +
      '<div class="phone-foot"><span class="phone-foot-dot"></span>Delivered</div>' +
    '</div>';
  }

  function renderReveal(sc, entry){
    const correct = !!entry.correct;
    const res = correct ? sc.safeResult : sc.unsafeResult;

    const signalsHTML = sc.signals.map(function(s, i){
      return '' +
      '<div class="signal">' +
        '<div class="signal-num">' + pad(i + 1) + '</div>' +
        '<div class="signal-text">' +
          '<div class="signal-name">' + s.name + '</div>' +
          '<div class="signal-detail">' + s.detail + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    const leverLabels = {
      reward:'Reward', fear:'Fear', authority:'Authority', trust:'Trust', urgency:'Urgency'
    };

    // Streak-update chip
    const showStreakUpdate = state.streak >= 2 && correct;
    const streakUpdateHTML =
      '<span class="streak-update"' + (showStreakUpdate ? '' : ' hidden') + '>' +
        ic('flame', 2.4) +
        '<span>' + state.streak + ' days in a row</span>' +
      '</span>';

    return '' +
    '<div class="reveal">' +
      '<div class="reveal-verdict-row">' +
        '<span class="reveal-verdict ' + (correct ? 'safe' : 'unsafe') + '"><span class="rd"></span>' +
          (correct ? 'Correct call' : 'Phished') +
        '</span>' +
        streakUpdateHTML +
      '</div>' +

      '<h2 class="reveal-title">' + res.title + '</h2>' +
      '<p class="reveal-body">' + res.body + '</p>' +

      '<div class="block signals">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('alert', 2) + '</div>' +
          '<div class="block-label">Signals in this message</div>' +
        '</div>' +
        '<div class="signal-list">' + signalsHTML + '</div>' +
      '</div>' +

      '<div class="block stakes">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('shieldAlert', 2) + '</div>' +
          '<div class="block-label">What was at stake</div>' +
        '</div>' +
        '<p>' + sc.stakes + '</p>' +
      '</div>' +

      '<div class="block verify">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('checkCircle', 2) + '</div>' +
          '<div class="block-label">How to verify</div>' +
        '</div>' +
        '<p>' + sc.verify + '</p>' +
      '</div>' +

      '<div class="block lever-block">' +
        '<div class="block-head">' +
          '<div class="block-icon">' + ic('target', 2) + '</div>' +
          '<div class="block-label">The lever used</div>' +
        '</div>' +
        '<span class="lever-name"><span class="ld"></span>' + (leverLabels[sc.lever] || sc.lever) + '</span>' +
        '<p class="lever-explain">' + sc.leverExplain + '</p>' +
      '</div>' +

      '<div class="share-row">' +
        '<button type="button" class="btn btn-primary" data-action="share">' +
          ic('share', 2.2) + 'Challenge a friend' +
        '</button>' +
        '<a class="btn btn-secondary" href="screen6.html">More scenarios</a>' +
      '</div>' +
      '<div class="share-status" id="shareStatus">Link copied — send it to a friend.</div>' +
    '</div>';
  }

  function renderComeback(){
    const s = state.streak || 0;
    let message;
    if (s >= 7) message = 'A full week. <strong>You\'re building the habit.</strong> Come back tomorrow to keep it going.';
    else if (s >= 3) message = 'Nice rhythm. <strong>Three or more in a row</strong> is where it starts to stick. See you tomorrow.';
    else message = 'You\'re one scenario in. <strong>Come back tomorrow</strong> to start a streak.';

    return '' +
    '<div class="comeback">' +
      '<div class="comeback-icon">' + ic('clock', 2.4) + '</div>' +
      '<h2 class="comeback-title">That\'s today\'s Daily Phish done.</h2>' +
      '<p class="comeback-sub">' + message + '</p>' +
      '<div class="comeback-actions">' +
        '<a class="btn btn-primary" href="screen6.html">More scenarios now ' + ic('arrow', 2.2) + '</a>' +
        '<a class="btn btn-secondary" href="guide.html">Read the guide</a>' +
      '</div>' +
    '</div>';
  }

  function renderYesterday(){
    const yKey = yesterdayKey();
    const yEntry = state.history[yKey];
    if (!yEntry) return '';

    const yIdx = -1; // We don't know which index was yesterday's scenario without storing it
    // Find the scenario by id in history
    const ySc = SCENARIOS.find(function(s){ return s.id === yEntry.id; });
    if (!ySc) return '';

    return '' +
    '<div class="yesterday">' +
      '<div class="yesterday-head">' +
        '<div class="yesterday-icon">' + ic('clock', 2.2) + '</div>' +
        '<div>' +
          '<div class="yesterday-label">Yesterday\'s answer</div>' +
          '<div class="yesterday-title">' + ySc.title + '</div>' +
        '</div>' +
      '</div>' +
      '<p class="yesterday-body">' + (ySc.safeResult.title) + ' — ' + (ySc.safeResult.body) + '</p>' +
      '<span class="yesterday-your ' + (yEntry.correct ? 'correct' : 'wrong') + '">' +
        (yEntry.correct ? '✓ You got it right' : '✗ You were caught') +
      '</span>' +
    '</div>';
  }

  // ═══════════════ ACTIONS ═══════════════
  function answer(index){
    if (isAnsweredToday()) return;

    const sc = todaysScenario();
    const choice = sc.choices[index];
    if (!choice) return;

    const correct = !!choice.safe;
    const today = dateKey();

    // Streak: increment if lastAnswered was yesterday, else start at 1
    if (state.lastAnswered === yesterdayKey()){
      state.streak = (state.streak || 0) + 1;
    } else if (state.lastAnswered !== today){
      state.streak = 1;
    }
    if (state.streak > (state.bestStreak || 0)) state.bestStreak = state.streak;

    state.history[today] = {
      id: sc.id,
      correct: correct,
      choice: index,
      at: Date.now()
    };
    state.lastAnswered = today;

    save();
    render();

    // Smooth-scroll to the reveal
    setTimeout(function(){
      const el = document.querySelector('.reveal');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }

  function share(){
    const sc = todaysScenario();
    const text = 'CyberWise Daily Phish: ' + sc.title + ' — can you spot it?';
    const url = window.location.href;

    if (navigator.share){
      navigator.share({ title:'CyberWise Daily Phish', text: text, url: url }).catch(function(){});
      return;
    }

    if (navigator.clipboard){
      navigator.clipboard.writeText(text + ' ' + url).then(function(){
        const el = document.getElementById('shareStatus');
        if (el){
          el.classList.add('show');
          setTimeout(function(){ el.classList.remove('show'); }, 2400);
        }
      }).catch(function(){});
    }
  }

  // ═══════════════ EVENTS ═══════════════
  document.addEventListener('click', function(e){
    const choice = e.target.closest('[data-choice]');
    if (choice){
      answer(parseInt(choice.getAttribute('data-choice'), 10));
      return;
    }

    const action = e.target.closest('[data-action]');
    if (action){
      const a = action.getAttribute('data-action');
      if (a === 'share') { share(); return; }
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (!isAnsweredToday()){
      if (e.key === '1' || e.key === '2'){
        e.preventDefault();
        answer(parseInt(e.key, 10) - 1);
      }
    }
  });

  // ═══════════════ THEME TOGGLE ═══════════════
  (function theme(){
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    btn.addEventListener('click', function(){
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('cyberwise.theme', next); } catch (e) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', next === 'dark' ? '#0B0A17' : '#F5F4FB');
    });
  })();

  // ═══════════════ TOPBAR SCROLL ═══════════════
  (function topbar(){
    const el = document.getElementById('topbar');
    if (!el) return;
    function update(){ el.classList.toggle('scrolled', window.scrollY > 12); }
    window.addEventListener('scroll', update, { passive:true });
    update();
  })();

  // ═══════════════ CUSTOM CURSOR ═══════════════
  (function cursor(){
    const canRun = window.matchMedia('(hover: hover) and (pointer: fine)').matches && window.innerWidth > 1024;
    if (!canRun) return;
    const dot  = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    if (!dot || !ring) return;

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;
    let scale = 1, targetScale = 1;

    window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, { passive:true });

    document.addEventListener('mouseover', function(e){
      const t = e.target.closest('a, button, .choice, .calendar');
      if (t){
        targetScale = 1.14;
        ring.classList.add('is-hover');
        if (t.classList.contains('btn-primary') || t.classList.contains('choice')) {
          ring.classList.add('is-cta');
        }
      }
    });

    document.addEventListener('mouseout', function(e){
      const t = e.target.closest('a, button, .choice, .calendar');
      if (t){
        targetScale = 1;
        ring.classList.remove('is-hover', 'is-cta');
      }
    });

    (function tick(){
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      scale += (targetScale - scale) * 0.22;
      dot.style.transform  = 'translate3d(' + (mx - 3) + 'px,' + (my - 3) + 'px,0)';
      ring.style.transform = 'translate3d(' + (rx - 13) + 'px,' + (ry - 13) + 'px,0) scale(' + scale + ')';
      requestAnimationFrame(tick);
    })();
  })();

  // ═══════════════ BOOT ═══════════════
  render();
})();
</script>
<script src="register-sw.js"></script>
<script src="navigation.js"></script>
</body>
